<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keepsake</title>
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c1432a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keepsake">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eeeae0; --surface:#fbf9f3; --surface-2:#f2eee2;
  --ink:#2a2420; --ink-soft:#6d6255; --ink-faint:#9a8f7f;
  --line:#ddd4c1; --line-soft:#e6dfcf;
  --accent:#c1432a; --accent-ink:#fff6ef; --accent-soft:#f3ded6;
  --olive:#4d6640; --olive-soft:#dfe6d5;
  --gold:#b3811f; --gold-soft:#f0e2c2;
  --shadow: 0 1px 2px rgba(42,36,32,.06), 0 8px 24px -12px rgba(42,36,32,.18);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1712; --surface:#241e18; --surface-2:#2b2419;
    --ink:#f2e9db; --ink-soft:#c2b6a2; --ink-faint:#8a7d6b;
    --line:#3c3325; --line-soft:#332b20;
    --accent:#e2724f; --accent-ink:#241108; --accent-soft:#3c2419;
    --olive:#8fae7c; --olive-soft:#2a331f;
    --gold:#dcb15c; --gold-soft:#3a2f18;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1712; --surface:#241e18; --surface-2:#2b2419;
  --ink:#f2e9db; --ink-soft:#c2b6a2; --ink-faint:#8a7d6b;
  --line:#3c3325; --line-soft:#332b20;
  --accent:#e2724f; --accent-ink:#241108; --accent-soft:#3c2419;
  --olive:#8fae7c; --olive-soft:#2a331f;
  --gold:#dcb15c; --gold-soft:#3a2f18;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{background:var(--bg);}
body{background:var(--bg); color:var(--ink); font-family:'Karla',system-ui,sans-serif; margin:0; min-height:100vh;}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif; margin:0; text-wrap:balance;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--accent-soft);}
.app{display:flex; min-height:100vh;}

/* Sidebar */
.sidebar{width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px 14px; gap:18px; position:sticky; top:0; height:100vh; overflow-y:auto;}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px; width:100%;}
.brand:hover .brand-name{color:var(--accent);}
.brand-mark{width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:18px; flex-shrink:0;}
.brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:19px; line-height:1.1;}
.brand-sub{font-size:11px; color:var(--ink-faint); letter-spacing:.04em;}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav-btn{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; border:none; background:transparent; color:var(--ink-soft); font-size:14.5px; font-weight:600; text-align:left;}
.nav-btn:hover{background:var(--surface-2); color:var(--ink);}
.nav-btn.active{background:var(--accent-soft); color:var(--accent);}
.nav-btn .ic{width:18px; text-align:center; font-size:15px;}
.nav-sep{height:1px; background:var(--line-soft); margin:8px 4px;}
.sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px;}
.profile-switch{display:flex; gap:6px; background:var(--surface-2); border-radius:10px; padding:4px;}
.profile-pill{flex:1; text-align:center; padding:7px 4px; border-radius:7px; border:none; background:transparent; font-size:12.5px; font-weight:700; color:var(--ink-faint);}
.profile-pill.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}
.icon-btn{border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:8px; color:var(--ink-soft); font-size:13px;}
.icon-btn:hover{color:var(--ink); border-color:var(--ink-faint);}

/* Main */
.main{flex:1; min-width:0; padding:26px 34px 60px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.page-head h1{font-size:28px;}
.page-head .sub{color:var(--ink-soft); font-size:14px; margin-top:4px;}
.btn{display:inline-flex; align-items:center; gap:7px; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:13.5px; white-space:nowrap;}
.btn:hover{border-color:var(--ink-faint);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
.btn.small{padding:6px 11px; font-size:12.5px; border-radius:8px;}
.btn.danger{color:#b3281a;}
.btn:disabled{opacity:.6; cursor:default;}

/* toggle */
.viewtoggle{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:4px; gap:4px;}
.viewtoggle button{padding:8px 16px; border-radius:7px; border:none; background:transparent; font-weight:700; font-size:13.5px; color:var(--ink-soft);}
.viewtoggle button.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}

/* toolbar */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px;}
.search-box{flex:1; min-width:180px; position:relative;}
.search-box input{width:100%; padding:10px 12px 10px 34px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px;}
.search-box .sicon{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:13px;}
select, .selectlike{padding:9px 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; font-weight:600;}
.chiprow{display:flex; gap:7px; flex-wrap:wrap; margin:0 0 16px;}
.chip{padding:5px 11px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line-soft); font-size:12px; font-weight:700; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;}
.chip.on{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
.chip button{background:none; border:none; color:inherit; font-size:12px; padding:0; line-height:1;}
.filter-panel{display:flex; flex-wrap:wrap; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px;}
.filter-panel label{display:flex; flex-direction:column; gap:5px; font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em;}

/* cards / list */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
.rcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; cursor:pointer;}
.rcard:hover{border-color:var(--ink-faint);}
.rcard .photo{height:150px; background:var(--surface-2); position:relative; overflow:hidden;}
.rcard .photo img{width:100%; height:100%; object-fit:cover; display:block;}
.rcard .photo .noimg{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:28px;}
.fav-badge{position:absolute; top:8px; right:8px; width:27px; height:27px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:13px;}
.del-badge{position:absolute; top:8px; left:8px; width:27px; height:27px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:13px; border:none; padding:0; z-index:2;}
.del-badge:hover{background:var(--accent-soft); color:var(--accent);}
.fav-heart{color:var(--accent);}
.rcard .body{padding:12px 13px 14px; display:flex; flex-direction:column; gap:6px;}
.rcard .name{font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; line-height:1.2;}
.rcard .meta{font-size:12px; color:var(--ink-soft);}
.badge{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:3px 7px; border-radius:6px;}
.badge.yes{background:var(--olive-soft); color:var(--olive);}
.badge.maybe{background:var(--gold-soft); color:var(--gold);}
.badge.no{background:var(--accent-soft); color:var(--accent);}
.tagrow{display:flex; gap:5px; flex-wrap:wrap;}
.tag{font-size:10.5px; font-weight:700; color:var(--ink-soft); background:var(--surface-2); padding:3px 7px; border-radius:6px;}

.listrow{display:flex; align-items:center; gap:14px; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:9px; cursor:pointer;}
.listrow:hover{border-color:var(--ink-faint);}
.listrow .thumb{width:54px; height:54px; border-radius:9px; background:var(--surface-2); overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);}
.listrow .thumb img{width:100%; height:100%; object-fit:cover;}
.listrow .main-col{flex:1; min-width:0;}
.listrow .name{font-family:'Fraunces',serif; font-weight:600; font-size:15.5px;}
.listrow .meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.listrow .right-col{display:flex; align-items:center; gap:14px; flex-shrink:0;}

/* stars */
.stars{display:inline-flex; gap:2px; vertical-align:middle;}
.star{position:relative; display:inline-block; flex-shrink:0;}
.star svg{position:absolute; top:0; left:0; display:block;}
.star .fill{overflow:hidden; position:absolute; top:0; left:0; height:100%;}
.stareditor{display:inline-flex; gap:3px; vertical-align:middle;}
.stareditor .star{cursor:pointer;}
.stareditor .star .hitl,.stareditor .star .hitr{position:absolute; top:0; width:50%; height:100%; z-index:2; background:none; border:none; padding:0; margin:0; -webkit-appearance:none; appearance:none;}
.stareditor .star .hitl{left:0;} .stareditor .star .hitr{right:0;}

/* empty state */
.empty{text-align:center; padding:70px 20px; color:var(--ink-soft);}
.empty .emoji{font-size:38px; margin-bottom:10px;}
.empty h3{font-size:19px; margin-bottom:6px; color:var(--ink);}

/* stat tiles */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-bottom:24px;}
.stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow);}
.stat-tile .lbl{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:8px;}
.stat-tile .val{font-family:'Fraunces',serif; font-size:26px; font-weight:600; line-height:1.1;}
.stat-tile .sub{font-size:12px; color:var(--ink-soft); margin-top:4px;}

/* map */
.mapwrap{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:0; overflow:hidden; box-shadow:var(--shadow);}
.mapnote{padding:10px 16px; font-size:12px; color:var(--ink-faint); border-bottom:1px solid var(--line-soft); background:var(--surface-2);}
#leafletMap{height:560px; width:100%; background:var(--surface-2); position:relative; z-index:0; isolation:isolate;}
.pp-marker{width:26px; height:26px; border-radius:50% 50% 50% 0; background:var(--accent); transform:rotate(-45deg); border:2px solid var(--surface); box-shadow:var(--shadow); cursor:pointer;}
.pp-marker.want{background:var(--gold);}
.maplibregl-map{font-family:'Karla',system-ui,sans-serif;}
.maplibregl-popup-content{background:var(--surface); color:var(--ink); border-radius:12px; box-shadow:var(--shadow); padding:0;}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--surface);}
.maplibregl-popup-anchor-top .maplibregl-popup-tip{border-bottom-color:var(--surface);}
.maplibregl-popup-close-button{color:var(--ink-faint); font-size:18px; padding:2px 8px 0 0;}
.maplibregl-ctrl-group{background:var(--surface) !important; border-radius:10px !important; box-shadow:var(--shadow) !important; overflow:hidden; border:none !important;}
.maplibregl-ctrl-group button{background:var(--surface) !important; width:30px !important; height:30px !important;}
.maplibregl-ctrl-group button:hover{background:var(--surface-2) !important;}
.maplibregl-ctrl-group button + button{border-top:1px solid var(--line-soft) !important;}
.maplibregl-ctrl-attrib{background:var(--surface) !important; color:var(--ink-faint) !important; opacity:.82; border-radius:6px 0 0 0 !important; font-size:10px !important;}
.maplibregl-ctrl-attrib a{color:var(--ink-soft) !important;}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl{margin:0 6px 6px 0;}
.geo-search-wrap{position:relative;}
.geo-suggestions{position:absolute; top:100%; left:0; right:0; margin-top:4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); z-index:5; max-height:240px; overflow-y:auto; display:none;}
.geo-suggestions.open{display:block;}
.geo-suggestion-item{display:block; width:100%; text-align:left; padding:9px 12px; border:none; border-bottom:1px solid var(--line-soft); background:var(--surface); color:var(--ink); cursor:pointer;}
.geo-suggestion-item:last-child{border-bottom:none;}
.geo-suggestion-item:hover, .geo-suggestion-item:focus{background:var(--surface-2);}
.geo-suggestion-item .gs-name{font-weight:700; font-size:13px;}
.geo-suggestion-item .gs-addr{font-size:11px; color:var(--ink-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.geo-suggestion-empty{padding:10px 12px; font-size:12px; color:var(--ink-faint);}
#pickerMap{height:220px; border-radius:12px; overflow:hidden; margin-top:8px; border:1px solid var(--line); background:var(--surface-2); position:relative; z-index:0; isolation:isolate;}
.geo-hint{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(20,16,12,.5); display:flex; align-items:flex-start; justify-content:center; padding:calc(40px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); overflow-y:auto; z-index:100;}
.modal{background:var(--surface); border-radius:18px; max-width:640px; width:100%; box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:40px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line-soft);}
.modal-head h2{font-size:19px;}
.modal-body{padding:20px 22px; display:flex; flex-direction:column; gap:16px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line-soft); display:flex; justify-content:flex-end; gap:10px;}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint);}
.field input[type=text], .field input[type=date], .field input[type=number], .field textarea, .field select{padding:10px 11px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:16px; font-family:inherit; width:100%;}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:flex; gap:12px; flex-wrap:wrap;}
.quick-add-option{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:16px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer;}
.quick-add-option:hover{border-color:var(--accent); background:var(--accent-soft);}
.quick-add-option .qa-icon{font-size:26px; flex-shrink:0; line-height:1;}
.quick-add-option .qa-text{display:flex; flex-direction:column; gap:2px;}
.quick-add-option .qa-title{font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:var(--ink);}
.quick-add-option .qa-sub{font-size:12.5px; color:var(--ink-soft);}
.field-row .field{flex:1; min-width:140px;}
.chip-select{display:flex; flex-wrap:wrap; gap:6px;}
.chip-select button{padding:6px 11px; border-radius:99px; border:1px solid var(--line); background:var(--surface-2); font-size:12px; font-weight:700; color:var(--ink-soft);}
.chip-select button.on{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:800;}
.rate-row{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface-2); padding:10px 12px; border-radius:10px;}
.rate-row .who{font-size:13px; font-weight:700;}
.photo-row{display:flex; gap:10px; flex-wrap:wrap;}
.photo-thumb{width:76px; height:76px; border-radius:10px; overflow:hidden; position:relative; border:1px solid var(--line);}
.photo-thumb img{width:100%; height:100%; object-fit:cover;}
.photo-thumb .rm{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; line-height:1;}
.addphoto-btn{width:76px; height:76px; border-radius:10px; border:1.5px dashed var(--line); background:var(--surface-2); color:var(--ink-faint); font-size:20px; display:flex; align-items:center; justify-content:center;}
.wr-row{display:flex; gap:8px;}
.wr-row button{flex:1; padding:9px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); font-weight:700; font-size:12.5px; color:var(--ink-soft);}
.wr-row button.on-yes{background:var(--olive-soft); color:var(--olive); border-color:transparent;}
.wr-row button.on-maybe{background:var(--gold-soft); color:var(--gold); border-color:transparent;}
.wr-row button.on-no{background:var(--accent-soft); color:var(--accent); border-color:transparent;}

/* detail drawer */
.detail-hero{position:relative; height:220px; background:var(--surface-2);}
.detail-hero img{width:100%; height:100%; object-fit:cover;}
.visit-item{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:var(--surface);}
.visit-item .vhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:6px;}
.visit-item .vdate{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-faint);}
.visit-photos{display:flex; gap:6px; margin-top:8px;}
.visit-photos img{width:64px; height:64px; object-fit:cover; border-radius:8px; cursor:zoom-in;}

/* wrapped */
.wrap-slide{background:linear-gradient(160deg, var(--accent), var(--gold)); color:var(--accent-ink); border-radius:22px; padding:44px 36px; min-height:320px; display:flex; flex-direction:column; justify-content:center; gap:10px; box-shadow:var(--shadow);}
.wrap-slide .k{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; opacity:.85;}
.wrap-slide .big{font-family:'Fraunces',serif; font-size:42px; font-weight:600; line-height:1.08;}
.wrap-slide .foot{font-size:14px; opacity:.9;}
.wrap-nav{display:flex; justify-content:center; gap:10px; margin-top:16px;}
.wrap-dot{width:8px; height:8px; border-radius:50%; background:var(--line); border:none;}
.wrap-dot.on{background:var(--accent);}

.section-title{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin:26px 0 12px;}
.section-title:first-child{margin-top:0;}
.shelf{display:flex; gap:14px; overflow-x:auto; padding-bottom:6px;}
.shelf .rcard{min-width:210px;}

@media (max-width:860px){
  .sidebar{position:fixed; z-index:50; transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow); padding-top:calc(20px + env(safe-area-inset-top)); padding-bottom:calc(20px + env(safe-area-inset-bottom));}
  .sidebar.open{transform:translateX(0);}
  .main{padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));}
  .mobile-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sidebar-backdrop{position:fixed; inset:0; background:rgba(15,12,9,.45); z-index:49; opacity:0; pointer-events:none; transition:opacity .2s;}
  .sidebar-backdrop.open{opacity:1; pointer-events:auto;}
}
@media (min-width:861px){ .mobile-topbar{display:none;} }
@media (max-width:560px){
  .listrow{flex-wrap:wrap; row-gap:8px;}

/* ---------- image compression ---------- */
function compressImage(file){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(){
      var img = new Image();
      img.onerror = reject;
      img.onload = function(){
        try{
          function tryQuality(maxDim, quality){
            var w=img.width, h=img.height;
            var scale = Math.min(1, maxDim/Math.max(w,h));
            var cw = Math.round(w*scale), ch = Math.round(h*scale);
            var canvas = document.createElement("canvas");
            canvas.width=cw; canvas.height=ch;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img,0,0,cw,ch);
            return canvas.toDataURL("image/jpeg", quality);
          }
          var attempts = [[1280,.72],[1100,.62],[950,.5],[800,.4],[650,.32]];
          var result = null;
          for(var i=0;i<attempts.length;i++){
            var d = tryQuality(attempts[i][0], attempts[i][1]);
            if(d.length < 260000){ result = d; break; }
            result = d;
          }
          resolve(result);
        }catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- db wiring (Firebase Firestore) ---------- */
function initDb(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf("YOUR_")===0 || !window.firebase){
    state.dbReady=false; renderSync(); return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
  }catch(e){ console.error("Firebase init failed", e); state.dbReady=false; renderSync(); return; }
  var fs = firebase.firestore();
  firebase.auth().signInAnonymously().catch(function(err){ console.error("Anonymous sign-in failed", err); });
  firebase.auth().onAuthStateChanged(function(user){
    if(!user) return;
    state.db = fs; state.dbReady = true; renderSync();
    fs.collection("restaurants").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=Object.assign({id:d.id},d.data()); });
      state.restaurants=m; scheduleRender();
    }, function(err){ console.error(err); });
    fs.collection("visits").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=Object.assign({id:d.id},d.data()); });
      state.visits=m; scheduleRender();
    }, function(err){ console.error(err); });
    fs.collection("lists").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=Object.assign({id:d.id},d.data()); });
      state.lists=m; scheduleRender();
    }, function(err){ console.error(err); });
    fs.collection("trips").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=Object.assign({id:d.id},d.data()); });
      state.trips=m; scheduleRender();
    }, function(err){ console.error(err); });
    fs.doc("settings/profiles").onSnapshot(function(snap){
      if(snap.exists){ state.profiles = Object.assign({A:"Kat",B:"Albie"}, snap.data()); }
      scheduleRender();
    }, function(err){ console.error(err); });
  });
}

/* ---------- filtering / sorting helpers for browse ---------- */
function matchesSearch(r, q){
  if(!q) return true;
  q = q.toLowerCase();
  var hay = [r.name, r.neighborhood, r.city].concat(r.cuisines||[]).concat(r.tags||[]).join(" ").toLowerCase();
  if(hay.indexOf(q)>=0) return true;
  var vs = visitsFor(r.id);
  return vs.some(function(v){
    return ((v.favDishA||"")+" "+(v.favDishB||"")+" "+(v.favDish||"")+" "+(v.dishes||[]).join(" ")+" "+(v.notes||"")).toLowerCase().indexOf(q)>=0;
  });
}
function passesFilters(r){
  var f = state.filters;
  if(f.city && r.city!==f.city) return false;
  if(f.neighborhood && r.neighborhood!==f.neighborhood) return false;
  if(f.cuisine && (r.cuisines||[]).indexOf(f.cuisine)<0) return false;
  if(f.tag && (r.tags||[]).indexOf(f.tag)<0) return false;
  if(f.price && String(r.priceRange)!==f.price) return false;
  if(f.wouldReturn){
    var vs = visitsFor(r.id);
    if(!vs.some(function(v){return v.wouldReturn===f.wouldReturn;})) return false;
  }
  return true;
}
function sortRestaurants(list){
  var s = state.sort;
  list = list.slice();
  if(s==="rating"){
    list.sort(function(a,b){ var sa=restaurantScore(a.id), sb=restaurantScore(b.id); if(sa==null&&sb==null) return 0; if(sa==null) return 1; if(sb==null) return -1; return sb-sa; });
  } else if(s==="alpha"){
    list.sort(function(a,b){ return a.name.localeCompare(b.name); });
  } else {
    list.sort(function(a,b){
      var da = lastVisitDate(a.id) || a.createdAt || "";
      var db_ = lastVisitDate(b.id) || b.createdAt || "";
      return String(db_).localeCompare(String(da));
    });
  }
  return list;
}
function distinctNeighborhoods(cityFilter){
  var set = {};
  allRestaurants().forEach(function(r){ if(r.neighborhood && (!cityFilter || r.city===cityFilter)) set[r.neighborhood]=1; });
  return Object.keys(set).sort();
}
function distinctCities(){
  var set = {};
  allRestaurants().forEach(function(r){ if(r.city) set[r.city]=1; });
  return Object.keys(set).sort();
}

}

    '</div>'+
    '<div class="body">'+
      '<div class="name">'+esc(r.name)+(r.favorite?' <span class="fav-heart">♥</span>':'')+'</div>'+

/* ---------- MAP view (real vector map: MapLibre + OpenFreeMap) ---------- */
function mapView(list){

function renderLeafletBrowseMap(list){
  var container = document.getElementById("leafletMap");
  if(!container || !window.maplibregl) return;
  if(window._ppBrowseMap){ window._ppBrowseMap.remove(); window._ppBrowseMap=null; }
  var withLoc = list.filter(hasLoc);
  var map = newMap("leafletMap", [0,20], 1);
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-right");
  window._ppBrowseMap = map;
  if(withLoc.length){
    var bounds = new maplibregl.LngLatBounds();
    withLoc.forEach(function(r){
      var vs = visitsFor(r.id);
      var el = ppMarkerEl("pp-marker"+(vs.length?"":" want"));
      var marker = new maplibregl.Marker({element:el, anchor:"bottom"}).setLngLat([r.lng,r.lat]).addTo(map);
      var photo = firstPhotoFor(r.id);
      var score = restaurantScore(r.id);
      var popupHtml = '<div style="width:200px;">'+
        (photo?'<img src="'+photo+'" style="width:100%;height:100px;object-fit:cover;border-radius:12px 12px 0 0;display:block;">':'')+
        '<div style="padding:10px 12px;">'+
        '<div style="font-family:Fraunces,serif;font-weight:600;font-size:14.5px;">'+esc(r.name)+'</div>'+
        '<div style="font-size:11.5px;color:var(--ink-soft);margin:2px 0 6px;">'+esc(r.neighborhood||"")+'</div>'+
        (score!=null?renderStarsDisplay(score):'<span style="font-size:11px;color:var(--ink-faint);">saved</span>')+
        '<div style="margin-top:9px;"><button class="btn small primary" style="width:100%;justify-content:center;" data-open-restaurant="'+r.id+'">View details</button></div>'+
        '</div></div>';
      marker.setPopup(new maplibregl.Popup({offset:25, maxWidth:"220px"}).setHTML(popupHtml));
      bounds.extend([r.lng,r.lat]);
    });
    map.on("load", function(){ map.fitBounds(bounds, {padding:48, maxZoom:15, duration:0}); });
  }
}

function viewFavorites(){

  html += '<div class="toolbar"><div class="search-box"><span class="sicon">⌕</span><input id="searchInput" type="text" placeholder="Search favourites…" value="'+esc(state.search)+'"></div></div>';

  html += '<div class="section-title">Our favourites</div>';
  html += pinned.length ? '<div class="grid-cards">'+pinned.map(restaurantCard).join('')+'</div>' : emptyState("♥","No pinned favourites yet","Open a restaurant's details and tap ♥ to pin it here.");

  html += '<div class="section-title">Top rated overall</div>';

  html += '<div class="section-title">Best by category</div>';
  var catCards = FAV_CATS.map(function(cat){
    var inCat = scored.filter(function(x){ return (x.r.tags||[]).indexOf(cat)>=0; });
    if(!inCat.length) return null;
    var top = inCat[0];
    return {cat:cat, r:top.r, s:top.s};
  }).filter(Boolean);
  html += catCards.length ? '<div class="grid-cards">'+catCards.map(function(c){
    return '<div class="rcard" data-open-restaurant="'+c.r.id+'"><div class="photo">'+(firstPhotoFor(c.r.id)?'<img src="'+firstPhotoFor(c.r.id)+'">':'<div class="noimg">🍽</div>')+'</div>'+
      '<div class="body"><div class="tag" style="align-self:flex-start;">Best '+esc(c.cat)+'</div><div class="name">'+esc(c.r.name)+'</div>'+renderStarsDisplay(c.s)+'</div></div>';
  }).join('')+'</div>' : emptyState("🏷","No category leaders yet","Tag a few places (Dessert, Coffee Shop, Cocktail Bar…) and rate your visits.");

  html += '<div class="section-title">Top dishes</div>';
  var dishes = [];
  allVisits().forEach(function(v){
    var r = state.restaurants[v.restaurantId];
    var restName = r?r.name:"?";
    var combined = avg([v.ratingA,v.ratingB]);
    if(v.favDishA){ dishes.push({dish:v.favDishA, rest:restName, rating:(v.ratingA!=null?v.ratingA:combined), rid:v.restaurantId, who:state.profiles.A}); }
    if(v.favDishB){ dishes.push({dish:v.favDishB, rest:restName, rating:(v.ratingB!=null?v.ratingB:combined), rid:v.restaurantId, who:state.profiles.B}); }
    if(!v.favDishA && !v.favDishB){
      var legacy = v.favDish || (v.dishes&&v.dishes[0]);
      if(legacy) dishes.push({dish:legacy, rest:restName, rating:combined, rid:v.restaurantId, who:null});
    }
  });
  dishes = dishes.filter(function(d){return d.rating!=null;});
  if(state.search){
    var qLower = state.search.toLowerCase();
    dishes = dishes.filter(function(d){ return (d.dish+" "+d.rest).toLowerCase().indexOf(qLower)>=0; });
  }
  dishes = dishes.sort(function(a,b){return b.rating-a.rating;}).slice(0,6);
  html += dishes.length ? '<div>'+dishes.map(function(d){

  }).join('')+'</div>' : emptyState("🍴","No favourite dishes logged","Add a favourite dish next time you log a visit.");

  return html;
}

/* ---------- STATS ---------- */
function computeStats(filterYear){
  var visits = allVisits().filter(function(v){ return !filterYear || (v.date||"").slice(0,4)===filterYear; });
  var visitedRids = {}; visits.forEach(function(v){visitedRids[v.restaurantId]=1;});
  var restaurantCount = Object.keys(visitedRids).length;
  var cuisineCount = {}, neighborhoodCount = {}, restCount = {};
  visits.forEach(function(v){
    var r = state.restaurants[v.restaurantId]; if(!r) return;
    (r.cuisines||[]).forEach(function(c){ cuisineCount[c]=(cuisineCount[c]||0)+1; });
    if(r.neighborhood) neighborhoodCount[r.neighborhood]=(neighborhoodCount[r.neighborhood]||0)+1;
    restCount[r.id]=(restCount[r.id]||0)+1;
  });
  function top(obj){ var k=Object.keys(obj); if(!k.length) return null; k.sort(function(a,b){return obj[b]-obj[a];}); return {key:k[0], count:obj[k[0]]}; }
  var ratings = visits.map(function(v){return avg([v.ratingA,v.ratingB]);}).filter(function(v){return v!=null;});
  var spendByMonth = {};
  visits.forEach(function(v){ if(typeof v.price==="number"){ var mk=monthKey(v.date); spendByMonth[mk]=(spendByMonth[mk]||0)+v.price; } });
  var totalPhotos = 0; visits.forEach(function(v){ totalPhotos += (v.photos||[]).length; });
  var topRest = top(restCount);
  return {
    restaurantCount: restaurantCount,
    cuisineCount: Object.keys(cuisineCount).length,
    avgRating: avg(ratings),
    topCuisine: top(cuisineCount),
    topRestaurant: topRest ? state.restaurants[topRest.key] : null,
    topRestaurantCount: topRest ? topRest.count : 0,
    topNeighborhood: top(neighborhoodCount),
    totalVisits: visits.length,
    totalPhotos: totalPhotos,
    spendByMonth: spendByMonth
  };
}
function viewStats(){
  var s = computeStats(null);
  var html = '<div class="page-head"><div><h1>Stats</h1><div class="sub">Your foodie footprint so far</div></div></div>';
  html += '<div class="stat-grid">'+
    statTile("Restaurants visited", s.restaurantCount) +
    statTile("Visits logged", s.totalVisits) +
    statTile("Cuisines tried", s.cuisineCount) +
    statTile("Average rating", s.avgRating!=null ? s.avgRating.toFixed(1)+" ★" : "—") +
    statTile("Most visited", s.topRestaurant ? s.topRestaurant.name : "—", s.topRestaurant ? s.topRestaurantCount+" visits" : "") +
    statTile("Most ordered cuisine", s.topCuisine ? s.topCuisine.key : "—", s.topCuisine ? s.topCuisine.count+" visits" : "") +
    statTile("Favourite neighbourhood", s.topNeighborhood ? s.topNeighborhood.key : "—") +
    statTile("Photos captured", s.totalPhotos) +
  '</div>';

  var months = Object.keys(s.spendByMonth).sort();
  if(months.length){
    var max = Math.max.apply(null, months.map(function(m){return s.spendByMonth[m];}));
    html += '<div class="section-title">Monthly dining spend</div>';
    html += '<div style="display:flex; align-items:flex-end; gap:8px; height:160px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow);">'+
      months.map(function(m){
        var h = Math.max(6, Math.round((s.spendByMonth[m]/max)*120));

/* ---------- WRAPPED ---------- */
var wrappedSlideIdx = 0;
function availableYears(){
  var set={};
  allVisits().forEach(function(v){ if(v.date) set[v.date.slice(0,4)]=1; });
  var y = Object.keys(set).sort().reverse();
  return y.length ? y : [String(new Date().getFullYear())];
}
function viewWrapped(){
  var years = availableYears();
  if(!state.wrappedYear || years.indexOf(state.wrappedYear)<0) state.wrappedYear = years[0];
  var s = computeStats(state.wrappedYear);
  var html = '<div class="page-head"><div><h1>'+state.wrappedYear+' Wrapped</h1><div class="sub">Your year in meals</div></div>'+
    '<select id="wrappedYearSelect">'+years.map(function(y){return '<option value="'+y+'"'+(y===state.wrappedYear?" selected":"")+'>'+y+'</option>';}).join('')+'</select></div>';

  var slides = [];
  slides.push({k:"Meals logged together", big:String(s.totalVisits), foot:s.restaurantCount+" different restaurants"});
  if(s.topRestaurant) slides.push({k:"Most visited", big:s.topRestaurant.name, foot:s.topRestaurantCount+" visits this year"});
  if(s.topCuisine) slides.push({k:"Top cuisine", big:s.topCuisine.key, foot:s.topCuisine.count+" meals"});
  if(s.avgRating!=null) slides.push({k:"Average rating", big:s.avgRating.toFixed(1)+" ★", foot:"across every visit logged"});
  if(s.topNeighborhood) slides.push({k:"Favourite neighbourhood", big:s.topNeighborhood.key, foot:s.topNeighborhood.count+" visits there"});
  slides.push({k:"Photos captured", big:String(s.totalPhotos), foot:"memories saved"});

  if(!s.totalVisits){
    html += emptyState("✦","No meals logged in "+state.wrappedYear,"Log a few visits this year to unlock your wrapped.");
    return html;
  }

  wrappedSlideIdx = clamp(wrappedSlideIdx,0,slides.length-1);
  var sl = slides[wrappedSlideIdx];
  html += '<div class="wrap-slide"><div class="k">'+esc(sl.k)+'</div><div class="big">'+esc(sl.big)+'</div><div class="foot">'+esc(sl.foot)+'</div></div>';
  html += '<div class="wrap-nav">'+
    '<button class="btn small" data-wrap-prev="1">‹ Prev</button>'+
    slides.map(function(_,i){return '<button class="wrap-dot'+(i===wrappedSlideIdx?' on':'')+'" data-wrap-dot="'+i+'"></button>';}).join('')+
    '<button class="btn small" data-wrap-next="1">Next ›</button>'+
  '</div>';
  return html;
}

var GEO_FIELDS = {
  name: {input:"f_name", suggestions:"geoSuggestions"},
  address: {input:"f_address", suggestions:"geoSuggestionsAddr"}
};
function hideGeoSuggestions(which){
  var ids = which ? [GEO_FIELDS[which].suggestions] : [GEO_FIELDS.name.suggestions, GEO_FIELDS.address.suggestions];
  ids.forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.classList.remove("open");
    el.innerHTML = "";
  });
}
function renderGeoSuggestions(results, which){
  var el = document.getElementById(GEO_FIELDS[which].suggestions);
  if(!el) return;
  if(!results.length){
    el.innerHTML = '<div class="geo-suggestion-empty">No matches — try refining, or tap the map.</div>';
    el.classList.add("open");
    return;
  }
  window.__geoResults = window.__geoResults || {};
  window.__geoResults[which] = results;
  el.innerHTML = results.map(function(res, i){
    var primary = (res.namedetails && res.namedetails.name) || res.display_name.split(",")[0];
    return '<button type="button" class="geo-suggestion-item" data-geo-idx="'+i+'" data-geo-which="'+which+'">'+
      '<div class="gs-name">'+esc(primary)+'</div>'+
      '<div class="gs-addr">'+esc(res.display_name)+'</div>'+
      '</button>';
  }).join("");
  el.classList.add("open");
}
var geoSearchTokens = {name:0, address:0};
function doGeoSearch(which){
  var input = document.getElementById(GEO_FIELDS[which].input);
  var q = input ? input.value.trim() : "";
  if(q.length < 3){ hideGeoSuggestions(which); return; }
  var myToken = ++geoSearchTokens[which];
  fetch("https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&namedetails=1&limit=6&q="+encodeURIComponent(q))
    .then(function(r){ return r.json(); })
    .then(function(results){
      if(myToken !== geoSearchTokens[which]) return;
      renderGeoSuggestions(results || [], which);
    })
    .catch(function(){
      if(myToken !== geoSearchTokens[which]) return;
      var el = document.getElementById(GEO_FIELDS[which].suggestions);
      if(el){ el.innerHTML = '<div class="geo-suggestion-empty">Search failed — check your connection.</div>'; el.classList.add("open"); }
    });
}
var debouncedGeoSearchName = debounce(function(){ doGeoSearch("name"); }, 400);
var debouncedGeoSearchAddress = debounce(function(){ doGeoSearch("address"); }, 400);
function selectGeoCandidateFromResult(res, which){
  which = which || "name";
  var lat = parseFloat(res.lat), lng = parseFloat(res.lon);
  editingRestaurant.lat = lat; editingRestaurant.lng = lng;
  applyGeoResultToFields(res, which);
  updateGeoHint();
  hideGeoSuggestions(which);
  try{
    placeSelectedMarker(lat, lng);
    if(pickerMapInstance) pickerMapInstance.flyTo({center:[lng,lat], zoom:16});
  }catch(err){ console.error("Map pin update failed", err); }
  var srcField = document.getElementById(GEO_FIELDS[which].input);
  if(srcField) srcField.blur();
}
function applyGeoResultToFields(res, which){
  var addr = res.address || {};
  var city = addr.city || addr.town || addr.village || addr.municipality || addr.county || "";
  var nbhd = addr.neighbourhood || addr.quarter || addr.suburb || addr.city_district || addr.borough || "";
  var poiClasses = {amenity:1, shop:1, tourism:1, leisure:1, craft:1, office:1, building:1};
  var isPoi = poiClasses[res.class];
  var placeName = (isPoi && res.namedetails && res.namedetails.name) || "";
  var fName = document.getElementById("f_name");
  var fAddress = document.getElementById("f_address");
  var fCity = document.getElementById("f_city");
  var fNbhd = document.getElementById("f_nbhd");
  if(which==="address"){
    if(fAddress) fAddress.value = res.display_name || (fAddress.value||"");
    if(fName && placeName && !fName.value.trim()) fName.value = placeName;
  } else {
    if(fName && placeName) fName.value = placeName;
  }
  if(fCity && city) fCity.value = city;
  if(fNbhd && nbhd) fNbhd.value = nbhd;
}

function findDuplicateRestaurant(name, excludeId){
  var norm = (name||"").trim().toLowerCase();
  if(!norm) return null;
  var match = null;
  allRestaurants().forEach(function(r){
    if(r.id!==excludeId && (r.name||"").trim().toLowerCase()===norm) match = r;
  });
  return match;
}

function applyTheme(theme){
  if(theme==="light" || theme==="dark"){ document.documentElement.setAttribute("data-theme", theme); }
  else { document.documentElement.removeAttribute("data-theme"); }
}
function exportAllData(){
  var payload = {
    exportedAt: new Date().toISOString(),
    profiles: state.profiles,
    restaurants: state.restaurants,
    visits: state.visits,
    lists: state.lists,
    trips: state.trips
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "keepsake-backup-"+todayStr()+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function renderAll(){
  renderNav(); renderProfileSwitch(); renderSync();

  switch(state.route){
    case "favorites": html = viewFavorites(); break;
    case "wanttotry": html = viewWantToTry(); break;

    case "trips": html = viewTrips(); break;

    window._ppBrowseMap.remove(); window._ppBrowseMap = null;

}

/* ---------- event delegation ---------- */
document.addEventListener("click", function(e){
  var t = e.target;

  // nav
  var routeBtn = t.closest("[data-route]");
  if(routeBtn){ state.route = routeBtn.getAttribute("data-route"); state.search=""; state.activeListId=null; state.activeTripId=null; closeSidebar(); renderAll(); return; }

  if(t.closest("#btnMenu")){ toggleSidebar(); return; }
  if(t.closest("#sidebarBackdrop")){ closeSidebar(); return; }
  if(t.closest("#btnHome") || t.closest("#btnHomeMobile")){ state.route="browse"; state.search=""; state.activeListId=null; state.activeTripId=null; closeSidebar(); renderAll(); return; }

  var meBtn = t.closest("[data-me]");
  if(meBtn){ state.me = meBtn.getAttribute("data-me"); localStorage.setItem("pp_me", state.me); renderAll(); return; }

  if(t.closest("#btnSettings")){ modalSettings(); return; }
  var themeBtn = t.closest("[data-set-theme]");
  if(themeBtn){
    state.theme = themeBtn.getAttribute("data-set-theme");
    localStorage.setItem("pp_theme", state.theme);
    applyTheme(state.theme);
    document.querySelectorAll("[data-set-theme]").forEach(function(b){ b.className = b.getAttribute("data-set-theme")===state.theme ? "on" : ""; });
    return;
  }
  if(t.closest("#btnExportData")){ exportAllData(); return; }
  if(t.closest("#btnAddVisit") || t.closest("#btnAddVisitMobile")){ modalQuickAdd(); return; }
  if(t.closest("#btnQuickLogVisit")){ closeModal(); modalLogVisit(null,null); return; }
  if(t.closest("#btnQuickSaveLater")){ closeModal(); modalEditRestaurant(null,null); return; }
  if(t.closest("#btnAddWant")){ modalEditRestaurant(null,null); return; }

  var bm = t.closest("[data-browse-mode]");
  if(bm){ state.browseMode = bm.getAttribute("data-browse-mode"); renderAll(); return; }

  if(t.closest("#btnToggleFilters")){ state.filtersOpen = !state.filtersOpen; renderAll(); return; }
  if(t.closest("#btnClearFilters")){ state.filters = {city:"",neighborhood:"",cuisine:"",tag:"",wouldReturn:"",price:""}; renderAll(); return; }
  var clearF = t.closest("[data-clear-filter]");
  if(clearF){ state.filters[clearF.getAttribute("data-clear-filter")] = ""; renderAll(); return; }

  var geoSug = t.closest("[data-geo-idx]");
  if(geoSug){
    var geoWhich = geoSug.getAttribute("data-geo-which");
    var geoIdx = parseInt(geoSug.getAttribute("data-geo-idx"),10);
    var geoRes = (window.__geoResults && window.__geoResults[geoWhich]) ? window.__geoResults[geoWhich][geoIdx] : null;
    if(geoRes) selectGeoCandidateFromResult(geoRes, geoWhich);
    return;
  }

  // restaurant open/edit/delete
  var openR = t.closest("[data-open-restaurant]");
  if(openR && !t.closest("button[data-log-visit-for]") && !t.closest("button[data-delete-restaurant]") ){ modalRestaurantDetail(openR.getAttribute("data-open-restaurant")); return; }
  var editR = t.closest("[data-edit-restaurant]");
  if(editR){ modalEditRestaurant(state.restaurants[editR.getAttribute("data-edit-restaurant")]); return; }
  var delR = t.closest("[data-delete-restaurant]");
  if(delR){ if(confirm("Delete this restaurant and all its visits?")){ deleteRestaurant(delR.getAttribute("data-delete-restaurant")); closeModal(); } return; }
  var favR = t.closest("[data-toggle-fav]");
  if(favR){
    var rid=favR.getAttribute("data-toggle-fav");
    var newFav = !state.restaurants[rid].favorite;
    state.restaurants[rid] = Object.assign({}, state.restaurants[rid], {favorite:newFav});
    updateRestaurant(rid,{favorite:newFav});
    modalRestaurantDetail(rid);
    return;
  }
  var logFor = t.closest("[data-log-visit-for]");
  if(logFor){ modalLogVisit(logFor.getAttribute("data-log-visit-for"), null); return; }
  var editV = t.closest("[data-edit-visit]");
  if(editV){ var v = state.visits[editV.getAttribute("data-edit-visit")]; modalLogVisit(v.restaurantId, v); return; }
  var delV = t.closest("[data-delete-visit]");
  if(delV){ if(confirm("Delete this visit?")){ var vid=delV.getAttribute("data-delete-visit"); var v2=state.visits[vid]; deleteVisit(vid); if(v2) modalRestaurantDetail(v2.restaurantId); } return; }
  var assignTrip = t.closest("[data-assign-trip]");
  if(assignTrip){ modalPickCollection("trip", assignTrip.getAttribute("data-assign-trip")); return; }

  // star editors
  var starSet = t.closest("[data-star-set]");
  if(starSet){
    var name = starSet.getAttribute("data-star-set");
    var val = parseFloat(starSet.getAttribute("data-star-val"));
    if(editingVisit) editingVisit[name] = val;
    var wrap = document.querySelector('[data-star-editor="'+name+'"]');
    if(wrap) wrap.outerHTML = renderStarEditor2(name, val);
    return;
  }
  var wrBtn = t.closest("[data-set-wr]");
  if(wrBtn){ editingVisit.wouldReturn = wrBtn.getAttribute("data-set-wr"); refreshWrRow(); return; }
  var priceBtn = t.closest("[data-set-price]");
  if(priceBtn){ editingRestaurant.priceRange = parseInt(priceBtn.getAttribute("data-set-price"),10); refreshChipUI(); return; }
  var chipBtn = t.closest("[data-toggle-chip]");
  if(chipBtn){
    var kind = chipBtn.getAttribute("data-toggle-chip"), val2 = chipBtn.getAttribute("data-val");
    var arr = kind==="cuisine" ? editingRestaurant.cuisines : editingRestaurant.tags;
    var idx2 = arr.indexOf(val2);
    if(idx2>=0) arr.splice(idx2,1); else arr.push(val2);
    refreshChipUI();
    return;
  }

  if(t.closest("#btnAddPhoto")){ document.getElementById("f_photoInput").click(); return; }
  var rmPhoto = t.closest("[data-rm-photo]");
  if(rmPhoto){ editingVisit.photos.splice(parseInt(rmPhoto.getAttribute("data-rm-photo"),10),1); document.getElementById("photoRow").innerHTML = photoRowHtml(); return; }

  if(t.closest("#btnSaveRestaurant")){ doSaveRestaurantFromForm(); return; }
  if(t.closest("#btnSaveVisit")){ doSaveVisitFromForm(); return; }
  if(t.closest("#btnSaveProfiles")){
    saveProfiles({A: document.getElementById("f_profA").value.trim()||"Kat", B: document.getElementById("f_profB").value.trim()||"Albie"});
    closeModal(); return;
  }

  if(t.closest("#btnNewList")){ modalListForm(null); return; }
  if(t.closest("#btnSaveList")){
    var lid = t.closest("#btnSaveList").getAttribute("data-list-id");
    var name = document.getElementById("f_listname").value.trim(); if(!name) return;
    var desc = document.getElementById("f_listdesc").value.trim();
    finishSave(saveList({name:name, description:desc}, lid||undefined));
    return;
  }
  var openList = t.closest("[data-open-list]");
  if(openList){ state.activeListId = openList.getAttribute("data-open-list"); state.search=""; renderAll(); return; }
  if(t.closest("[data-back-lists]")){ state.activeListId = null; state.search=""; renderAll(); return; }
  var delList = t.closest("[data-delete-list]");
  if(delList){ if(confirm("Delete this list?")){ deleteList(delList.getAttribute("data-delete-list")); state.activeListId=null; renderAll(); } return; }
  var addToList = t.closest("[data-add-to-list]");
  if(addToList){ modalAddExistingToCollection("list", addToList.getAttribute("data-add-to-list")); return; }
  var addToListFromDetail = t.closest("[data-addto-list-for]");
  if(addToListFromDetail){ modalPickCollection("list", addToListFromDetail.getAttribute("data-addto-list-for")); return; }
  var confirmPick = t.closest("#btnConfirmPickCollection");
  if(confirmPick){
    var kind4 = confirmPick.getAttribute("data-kind"), ridPick = confirmPick.getAttribute("data-rid");
    var selPick = document.getElementById("f_pick_collection");
    var chosen = selPick.value;
    function finishPick(cid){
      if(kind4==="list"){
        var l = state.lists[cid]; var ids5 = (l.restaurantIds||[]).slice();
        if(ids5.indexOf(ridPick)<0) ids5.push(ridPick);
        updateList(cid, {restaurantIds:ids5});
      } else {
        updateRestaurant(ridPick, {tripId: cid});
      }
      closeModal(); modalRestaurantDetail(ridPick);
    }
    if(chosen==="__new__"){
      var newCollectionName = document.getElementById("f_new_collection_name").value.trim();
      if(!newCollectionName) return;
      if(kind4==="list"){ saveList({name:newCollectionName, restaurantIds:[ridPick]}).then(function(){ closeModal(); modalRestaurantDetail(ridPick); }); }
      else { saveTrip({destination:newCollectionName}).then(function(tid2){ updateRestaurant(ridPick,{tripId:tid2}); closeModal(); modalRestaurantDetail(ridPick); }); }
    } else if(chosen){
      finishPick(chosen);
    }
    return;
  }
  var voteList = t.closest("[data-vote-list]");
  if(voteList){
    var lid2 = voteList.getAttribute("data-vote-list"), rid4 = voteList.getAttribute("data-vote-rest");
    var l = state.lists[lid2]; var votes = Object.assign({}, l.votes||{});
    var arr2 = (votes[rid4]||[]).slice();
    var mi = arr2.indexOf(state.me);
    if(mi>=0) arr2.splice(mi,1); else arr2.push(state.me);
    votes[rid4] = arr2;
    updateList(lid2, {votes:votes});
    return;
  }
  var rmFromList = t.closest("[data-remove-from-list]");
  if(rmFromList){
    var lid3 = rmFromList.getAttribute("data-remove-from-list"), rid5 = rmFromList.getAttribute("data-remove-rest");
    var ids2 = (state.lists[lid3].restaurantIds||[]).filter(function(x){return x!==rid5;});
    updateList(lid3, {restaurantIds:ids2});
    return;
  }

  if(t.closest("#btnNewTrip")){ modalTripForm(null); return; }
  if(t.closest("#btnSaveTrip")){
    var tid = t.closest("#btnSaveTrip").getAttribute("data-trip-id");
    var dest = document.getElementById("f_tripdest").value.trim(); if(!dest) return;
    finishSave(saveTrip({destination:dest, startDate:document.getElementById("f_tripstart").value, endDate:document.getElementById("f_tripend").value, notes:document.getElementById("f_tripnotes").value.trim()}, tid||undefined));
    return;
  }
  var openTrip = t.closest("[data-open-trip]");
  if(openTrip){ state.activeTripId = openTrip.getAttribute("data-open-trip"); state.search=""; renderAll(); return; }
  if(t.closest("[data-back-trips]")){ state.activeTripId = null; state.search=""; renderAll(); return; }
  var delTrip = t.closest("[data-delete-trip]");
  if(delTrip){ if(confirm("Delete this trip?")){ deleteTrip(delTrip.getAttribute("data-delete-trip")); state.activeTripId=null; renderAll(); } return; }
  var addToTrip = t.closest("[data-add-to-trip]");
  if(addToTrip){ modalAddExistingToCollection("trip", addToTrip.getAttribute("data-add-to-trip")); return; }

  var confirmAdd = t.closest("#btnConfirmAddToCollection");
  if(confirmAdd){
    var kind2 = confirmAdd.getAttribute("data-kind"), cid = confirmAdd.getAttribute("data-cid");
    var existingId = document.getElementById("f_pick_existing").value;
    var newNameField = document.getElementById(kind2==="trip" ? "f_name" : "f_pick_new");
    var newName = newNameField ? newNameField.value.trim() : "";
    function withRid(ridResolved){
      if(kind2==="list"){
        var l = state.lists[cid]; var ids3 = (l.restaurantIds||[]).slice();
        if(ids3.indexOf(ridResolved)<0) ids3.push(ridResolved);
        updateList(cid, {restaurantIds:ids3});
      } else {
        updateRestaurant(ridResolved, {tripId: cid});
      }
      closeModal(); renderAll();
    }
    if(existingId){ withRid(existingId); return; }
    if(!newName) return;
    var dup = findDuplicateRestaurant(newName);
    if(dup){
      alert('"'+newName+'" is already saved — opening the existing entry instead.');
      closeModal(); modalRestaurantDetail(dup.id);
      return;
    }
    var newData = {name:newName, cuisines:[], tags:[]};
    if(kind2==="trip"){
      newData.address = (document.getElementById("f_address")||{}).value || "";
      newData.city = (document.getElementById("f_city")||{}).value || "";
      newData.neighborhood = (document.getElementById("f_nbhd")||{}).value || "";
      newData.lat = hasLoc(editingRestaurant) ? editingRestaurant.lat : null;
      newData.lng = hasLoc(editingRestaurant) ? editingRestaurant.lng : null;
    }
    saveRestaurant(newData).then(withRid);
    return;
  }

  var zoomPhoto = t.closest("[data-zoom-photo]");
  if(zoomPhoto){ modalPhotoZoom(decodeURIComponent(zoomPhoto.getAttribute("data-zoom-photo"))); return; }

  var wrapDot = t.closest("[data-wrap-dot]");
  if(wrapDot){ wrappedSlideIdx = parseInt(wrapDot.getAttribute("data-wrap-dot"),10); renderAll(); return; }
  if(t.closest("[data-wrap-prev]")){ wrappedSlideIdx = Math.max(0,wrappedSlideIdx-1); renderAll(); return; }
  if(t.closest("[data-wrap-next]")){ wrappedSlideIdx = wrappedSlideIdx+1; renderAll(); return; }

  if(t.id==="overlay"){ closeModal(); return; }
  if(t.closest("[data-close-modal]")){ closeModal(); return; }
});

  if(e.target.id==="filterCity"){
    state.filters.city = e.target.value;
    if(state.filters.neighborhood && distinctNeighborhoods(state.filters.city).indexOf(state.filters.neighborhood)<0){ state.filters.neighborhood = ""; }
    renderAll();
  }
  if(e.target.id==="filterNeighborhood"){ state.filters.neighborhood = e.target.value; renderAll(); }
  if(e.target.id==="filterCuisine"){ state.filters.cuisine = e.target.value; renderAll(); }
  if(e.target.id==="filterTag"){ state.filters.tag = e.target.value; renderAll(); }
  if(e.target.id==="filterPrice"){ state.filters.price = e.target.value; renderAll(); }
  if(e.target.id==="filterWouldReturn"){ state.filters.wouldReturn = e.target.value; renderAll(); }
  if(e.target.id==="wrappedYearSelect"){ state.wrappedYear = e.target.value; wrappedSlideIdx=0; renderAll(); }
  if(e.target.id==="f_photoInput"){
    var file = e.target.files[0]; if(!file) return;
    compressImage(file).then(function(dataUrl){
      editingVisit.photos = editingVisit.photos||[];
      editingVisit.photos.push(dataUrl);
      document.getElementById("photoRow").innerHTML = photoRowHtml();
    }).catch(function(){ alert("Couldn't process that photo — try a different file."); });
  }
});
var debouncedRenderKeepFocus = debounce(function(){
  var active = document.activeElement, id = active && active.id, selStart = active && active.selectionStart;
  renderAll();
  if(id){ var el = document.getElementById(id); if(el){ el.focus(); if(selStart!=null && el.setSelectionRange){ try{el.setSelectionRange(selStart,selStart);}catch(e){} } } }
}, 180);

function refreshWrRow(){
  var row = document.querySelector(".wr-row"); if(!row) return;
  var buttons = row.querySelectorAll("button");
  buttons.forEach(function(b){
    var w = b.getAttribute("data-set-wr");
    b.className = editingVisit.wouldReturn===w ? "on-"+w : "";
  });
}
function refreshChipUI(){
  document.querySelectorAll("[data-toggle-chip]").forEach(function(b){
    var kind=b.getAttribute("data-toggle-chip"), val=b.getAttribute("data-val");
    var arr = kind==="cuisine"?editingRestaurant.cuisines:editingRestaurant.tags;
    b.className = arr.indexOf(val)>=0 ? "on" : "";
  });
  document.querySelectorAll("[data-set-price]").forEach(function(b){
    b.className = parseInt(b.getAttribute("data-set-price"),10)===editingRestaurant.priceRange ? "on" : "";
  });
}

function doSaveRestaurantFromForm(){
  var name = document.getElementById("f_name").value.trim();
  if(!name){ alert("Give this place a name."); return; }
  if(!editingRestaurant.id){
    var dup = findDuplicateRestaurant(name);
    if(dup){
      alert('"'+name+'" is already saved — opening the existing entry instead.');
      closeModal(); modalRestaurantDetail(dup.id);
      return;
    }
  }
  var data = {
    name: name,
    address: document.getElementById("f_address").value.trim(),
    city: document.getElementById("f_city").value.trim(),
    neighborhood: document.getElementById("f_nbhd").value.trim(),
    lat: hasLoc(editingRestaurant) ? editingRestaurant.lat : null,
    lng: hasLoc(editingRestaurant) ? editingRestaurant.lng : null,
    cuisines: editingRestaurant.cuisines.slice(),
    tags: editingRestaurant.tags.slice(),
    priceRange: editingRestaurant.priceRange || null,
    notes: document.getElementById("f_notes").value.trim(),
    favorite: !!editingRestaurant.favorite,
    tripId: editingRestaurant.tripId || null
  };
  finishSave(saveRestaurant(data, editingRestaurant.id));
}
function doSaveVisitFromForm(){
  var restaurantId = editingVisit.restaurantId;
  var isNewSelect = document.getElementById("f_visit_restaurant");
  function proceed(rid){
    var dishesStr = document.getElementById("f_dishes").value.trim();
    var priceVal = document.getElementById("f_price").value;
    var data = {
      restaurantId: rid,
      date: document.getElementById("f_date").value || todayStr(),
      ratingA: editingVisit.ratingA, ratingB: editingVisit.ratingB,
      wouldReturn: editingVisit.wouldReturn,
      dishes: dishesStr ? dishesStr.split(",").map(function(s){return s.trim();}).filter(Boolean) : [],
      favDishA: document.getElementById("f_favdishA").value.trim(),
      favDishB: document.getElementById("f_favdishB").value.trim(),
      notes: document.getElementById("f_visitnotes").value.trim(),
      price: priceVal!=="" ? parseFloat(priceVal) : null,
      photos: editingVisit.photos||[]
    };
    finishSave(saveVisit(data, editingVisit.id));
  }
  if(isNewSelect){
    if(isNewSelect.value==="__new__"){
      var newName = document.getElementById("f_name").value.trim();
      if(!newName){ alert("Name the new place, or pick an existing one."); return; }
      var dupVisit = findDuplicateRestaurant(newName);
      if(dupVisit){
        alert('"'+newName+'" is already saved — logging this visit against the existing entry.');
        proceed(dupVisit.id);
        return;
      }
      saveRestaurant({
        name:newName,
        address: (document.getElementById("f_address")||{}).value ? document.getElementById("f_address").value.trim() : "",
        city:document.getElementById("f_city").value.trim(),
        neighborhood:document.getElementById("f_nbhd").value.trim(),
        lat: hasLoc(editingRestaurant) ? editingRestaurant.lat : null,
        lng: hasLoc(editingRestaurant) ? editingRestaurant.lng : null,
        cuisines:[], tags:[]
      }).then(proceed);
    } else {
      proceed(isNewSelect.value);
    }
  } else {
    proceed(restaurantId);
  }
}

/* ---------- boot ---------- */
if(!state.me){ state.me = "A"; localStorage.setItem("pp_me","A"); }
applyTheme(state.theme);
renderAll();
initDb();
setTimeout(function(){ if(!state.dbReady){ seedLocalDemo(); renderAll(); } }, 900);
})();
</script>
