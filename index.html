<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>keepsake</title>
<link rel="icon" href="icon-512.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C8446A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="keepsake">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito:wght@400;500;600;700;800&family=Caveat:wght@500;600&family=Fredoka:wght@600&display=swap">
<style>
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F3F0EA;
  --ink:#33283A; --ink-soft:#6E6073; --ink-faint:#9C8E9F;
  --line:#E8E3DA; --line-soft:#F0ECE5;
  --accent:#C8446A; --accent-ink:#FFFFFF; --accent-soft:#FBE3EA;
  --olive:#2F6B4F; --olive-soft:#DCF0E4;
  --gold:#9A6512; --gold-soft:#FBEFC6;
  --star:#E89A2C; --honey-ink:#B36B12; --tape:rgba(240,222,178,.8); --note-pill:rgba(255,255,255,.62); --dock-bg:rgba(255,255,255,.86);
  --tint-1:#FDE3D2; --tint-2:#D9F0E4; --tint-3:#E7DEF7; --tint-4:#FBEFC6; --tint-5:#D8E9F7;
  --shadow: 0 1px 2px rgba(51,40,58,.05), 0 8px 24px -12px rgba(51,40,58,.16);
  --shadow-lift: 0 4px 10px rgba(51,40,58,.08), 0 20px 36px -14px rgba(51,40,58,.24);
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1520; --surface:#231D2A; --surface-2:#2B2433;
    --ink:#F5EEF4; --ink-soft:#BDB0BE; --ink-faint:#8A7D8F;
    --line:#372E40; --line-soft:#2F2737;
    --accent:#F07FA0; --accent-ink:#2A0F18; --accent-soft:#3A2231;
    --olive:#8FD1AE; --olive-soft:#213329;
    --gold:#F5BE5E; --gold-soft:#38331F;
    --star:#F5BE5E; --honey-ink:#F5BE5E; --tape:rgba(140,118,80,.55); --note-pill:rgba(0,0,0,.3); --dock-bg:rgba(35,29,42,.86);
    --tint-1:#3A2A26; --tint-2:#213329; --tint-3:#2C2640; --tint-4:#38331F; --tint-5:#22303D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-lift: 0 4px 10px rgba(0,0,0,.4), 0 22px 40px -14px rgba(0,0,0,.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1520; --surface:#231D2A; --surface-2:#2B2433;
  --ink:#F5EEF4; --ink-soft:#BDB0BE; --ink-faint:#8A7D8F;
  --line:#372E40; --line-soft:#2F2737;
  --accent:#F07FA0; --accent-ink:#2A0F18; --accent-soft:#3A2231;
  --olive:#8FD1AE; --olive-soft:#213329;
  --gold:#F5BE5E; --gold-soft:#38331F;
  --star:#F5BE5E; --honey-ink:#F5BE5E; --tape:rgba(140,118,80,.55); --note-pill:rgba(0,0,0,.3); --dock-bg:rgba(35,29,42,.86);
  --tint-1:#3A2A26; --tint-2:#213329; --tint-3:#2C2640; --tint-4:#38331F; --tint-5:#22303D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lift: 0 4px 10px rgba(0,0,0,.4), 0 22px 40px -14px rgba(0,0,0,.65);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{background:var(--bg);}
body{background:var(--bg); color:var(--ink); font-family:'Nunito',system-ui,sans-serif; margin:0; min-height:100vh; line-height:1.45; font-kerning:normal; text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif; margin:0; text-wrap:balance; letter-spacing:.01em; line-height:1.2;}
.mono{font-variant-numeric:tabular-nums;}
.hand{font-family:'Caveat',cursive; font-weight:600;}
a{color:inherit;}
button, input, select, textarea{font-family:inherit;}
button{cursor:pointer;}
::selection{background:var(--accent-soft);}
.app{min-height:100vh;}

/* Top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px;}
.brand{display:flex; align-items:center; gap:10px; border:none; background:transparent; padding:0; cursor:pointer; text-align:left; color:var(--ink);}
.brand-text{display:flex; flex-direction:column; gap:2px;}
.brand-mark{transition:transform .2s ease;}
.brand:hover .brand-mark{transform:rotate(-8deg);}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.who-btn{display:flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:4px 13px 4px 4px; font-family:'Fredoka',sans-serif; font-size:15px; font-weight:600; color:var(--ink); transition:border-color .15s ease;}
.who-btn:hover{border-color:var(--ink-faint);}
.who-btn .who-dot{width:28px; height:28px; font-size:12px;}
.icon-btn.round{border-radius:50%; padding:9px;}
.brand-mark{width:34px; height:34px; display:block; flex-shrink:0;}
.brand-name{font-family:'Fredoka',sans-serif; font-weight:600; font-size:23px; line-height:1; color:var(--accent);}
.brand-sub{font-family:'Caveat',cursive; font-size:17px; font-weight:600; color:var(--honey-ink); line-height:1.1;}
.loading-page{display:flex; flex-direction:column; align-items:center; gap:10px; padding:90px 0; font-family:'Caveat',cursive; font-size:24px; font-weight:600; color:var(--ink-faint);}
.loading-page .brand-mark{width:48px; height:48px; animation:locket-bob 1.4s ease-in-out infinite;}
@keyframes locket-bob{0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-6px) rotate(4deg);}}
/* Floating dock: tucks away while scrolling down and comes back on the way up */
.dock{position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60; display:flex; align-items:center; gap:10px; transition:transform .3s ease, opacity .3s ease;}
.dock.tucked{transform:translate(-50%, calc(100% + 40px)); opacity:0; pointer-events:none;}
.dock-pill{display:flex; gap:2px; padding:5px; background:var(--dock-bg); border:1px solid var(--line); border-radius:99px; box-shadow:var(--shadow-lift); -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4);}
.dock-btn{display:flex; align-items:center; gap:6px; height:42px; padding:0 14px; border:none; border-radius:99px; background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:700; transition:background .2s ease, color .2s ease;}
.dock-btn:hover{color:var(--ink); background:var(--surface-2);}
.dock-btn.active{background:var(--accent-soft); color:var(--accent);}
.dock-btn .ic{display:flex;}
.dock-add{width:52px; height:52px; border-radius:50%; border:none; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-lift); transition:transform .2s ease;}
.dock-add:hover{transform:scale(1.06) rotate(90deg);}

/* Who's here: asked each time the app opens, like a streaming service's profile picker */
.whos{position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; animation:whos-in .3s ease;}
.whos.leaving{animation:whos-out .26s ease forwards;}
@keyframes whos-in{from{opacity:0;} to{opacity:1;}}
@keyframes whos-out{to{opacity:0; transform:scale(1.03);}}
.whos-inner{text-align:center; width:100%; max-width:520px;}
.whos-mark{width:56px; height:56px; margin:0 auto 18px;}
.whos-title{font-family:'Fraunces',serif; font-size:42px; font-weight:500; line-height:1.05;}
.whos-sub{font-family:'Caveat',cursive; font-size:23px; font-weight:600; color:var(--ink-soft); margin-top:6px;}
.whos-people{display:flex; justify-content:center; gap:36px; margin:38px 0 30px;}
.whos-person{position:relative; display:flex; flex-direction:column; align-items:center; gap:12px; border:none; background:transparent; padding:0; color:var(--ink); transform:rotate(var(--tilt,0deg)); transition:transform .22s cubic-bezier(.2,.8,.2,1);}
.whos-person::before{content:""; position:absolute; top:-9px; left:50%; width:56px; height:18px; margin-left:-28px; background:var(--tape); transform:rotate(-4deg); z-index:2;}
.whos-person:hover,.whos-person:focus-visible{transform:rotate(0deg) translateY(-6px) scale(1.04); outline:none;}
.whos-av{width:132px; height:132px; border-radius:28px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:58px; font-weight:500; border:6px solid var(--surface); box-shadow:var(--shadow-lift); transition:box-shadow .2s ease;}
.whos-person:hover .whos-av,.whos-person:focus-visible .whos-av{box-shadow:0 0 0 3px var(--accent), var(--shadow-lift);}
.whos-name{font-family:'Fredoka',sans-serif; font-size:22px; font-weight:600;}
.icon-btn{border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:8px; color:var(--ink-soft); font-size:13px;}
.icon-btn:hover{color:var(--ink); border-color:var(--ink-faint);}
.icon-btn svg{display:block;}

/* Main */
.main{max-width:1120px; margin:0 auto; padding:18px 34px 130px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.page-head h1{font-size:28px; font-weight:600; letter-spacing:.012em;}
.page-head .sub{color:var(--ink-soft); font-size:14px; margin-top:4px;}
.btn{display:inline-flex; align-items:center; gap:7px; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:13.5px; white-space:nowrap;}
.btn:hover{border-color:var(--ink-faint);}
a.btn{text-decoration:none;}
.addr-link{display:inline-block; color:var(--ink-soft); font-size:12.5px; margin-top:3px; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px;}
.addr-link:hover{color:var(--accent); text-decoration-color:currentColor;}
.dir-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.dir-label{font-family:'Caveat',cursive; font-size:20px; font-weight:600; color:var(--ink-soft); margin-right:2px;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
.btn.small{padding:6px 11px; font-size:12.5px; border-radius:8px;}
.btn.danger{color:#b3281a;}
.btn:disabled{opacity:.6; cursor:default;}

/* toggle */
.viewtoggle{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:4px; gap:4px;}
.viewtoggle button{padding:8px 16px; border-radius:7px; border:none; background:transparent; font-weight:700; font-size:13.5px; color:var(--ink-soft);}
.viewtoggle button.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}

/* toolbar */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px;}
.search-box{flex:1; min-width:180px; position:relative;}
.search-box input{width:100%; padding:10px 12px 10px 34px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px;}
.search-box .sicon{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); display:flex; pointer-events:none;}
select, .selectlike{padding:9px 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; font-weight:600;}
.chip{padding:5px 11px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line-soft); font-size:12px; font-weight:700; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;}
.chip.on{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
.chip button{background:none; border:none; color:inherit; font-size:12px; padding:0; line-height:1;}

/* cards / list */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
.tint-1,.cat-bg-food{background:var(--tint-1);}
.tint-2,.cat-bg-outdoors{background:var(--tint-2);}
.tint-3,.cat-bg-shopping{background:var(--tint-3);}
.tint-4,.cat-bg-experiences,.cat-bg-list{background:var(--tint-4);}
.tint-5,.cat-bg-other{background:var(--tint-5);}
.fav-badge{position:absolute; top:8px; right:8px; width:27px; height:27px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:13px;}
.fav-heart{color:var(--accent);}
.badge{font-size:11.5px; font-weight:700; padding:2px 10px; border-radius:99px;}
.badge.yes{background:var(--olive-soft); color:var(--olive);}
.badge.maybe{background:var(--gold-soft); color:var(--gold);}
.badge.no{background:var(--accent-soft); color:var(--accent);}
.tagrow{display:flex; gap:5px; flex-wrap:wrap;}
.tag{font-size:10.5px; font-weight:700; color:var(--ink-soft); background:var(--surface-2); padding:3px 7px; border-radius:6px;}


/* stars */
.stars{display:inline-flex; gap:2px; vertical-align:middle;}
.star{position:relative; display:inline-block; flex-shrink:0;}
.star svg{position:absolute; top:0; left:0; display:block;}
.star .fill{overflow:hidden; position:absolute; top:0; left:0; height:100%;}
.stareditor{display:inline-flex; gap:3px; vertical-align:middle;}
.stareditor .star{cursor:pointer;}
.stareditor .star .hitl,.stareditor .star .hitr{position:absolute; top:0; width:50%; height:100%; z-index:2; background:none; border:none; padding:0; margin:0; -webkit-appearance:none; appearance:none;}
.stareditor .star .hitl{left:0;} .stareditor .star .hitr{right:0;}

/* empty state */
.empty{text-align:center; padding:70px 20px; color:var(--ink-soft);}
.empty .emoji{font-size:38px; margin-bottom:10px;}
.empty h3{font-size:19px; margin-bottom:6px; color:var(--ink);}


/* map */
.gmap-fill{width:100%; height:100%;}
.map-error{display:flex; align-items:center; justify-content:center; height:100%; padding:16px; text-align:center; font-size:13px; color:var(--ink-soft);}
.gm-style{font-family:'Nunito',system-ui,sans-serif;}
.geo-search-wrap{position:relative;}
.geo-suggestions{position:absolute; top:100%; left:0; right:0; margin-top:4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); z-index:5; max-height:240px; overflow-y:auto; display:none;}
.geo-suggestions.open{display:block;}
.geo-suggestion-item{display:block; width:100%; text-align:left; padding:9px 12px; border:none; border-bottom:1px solid var(--line-soft); background:var(--surface); color:var(--ink); cursor:pointer;}
.geo-suggestion-item:last-child{border-bottom:none;}
.geo-suggestion-item:hover, .geo-suggestion-item:focus{background:var(--surface-2);}
.geo-suggestion-item .gs-name{font-weight:700; font-size:13px;}
.geo-suggestion-item .gs-addr{font-size:11px; color:var(--ink-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.geo-suggestion-empty{padding:10px 12px; font-size:12px; color:var(--ink-faint);}
#pickerMap{height:220px; border-radius:12px; overflow:hidden; margin-top:8px; border:1px solid var(--line); background:var(--surface-2); position:relative; z-index:0; isolation:isolate;}
.geo-hint{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(20,16,12,.5); display:flex; align-items:flex-start; justify-content:center; padding:calc(40px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); overflow-y:auto; overscroll-behavior:contain; z-index:100;}
/* One scroll area per pop-up, sized to the visible screen (dvh excludes the phone's toolbars), with the title and save bar pinned. */
.modal{background:var(--surface); border-radius:18px; max-width:640px; width:100%; box-shadow:var(--shadow); border:1px solid var(--line);
  max-height:calc(100vh - 80px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); max-height:calc(100dvh - 80px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;}
html.modal-open, html.modal-open body{overflow:hidden;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line-soft); position:sticky; top:0; z-index:4; background:var(--surface);}
.modal-head h2{font-size:19px;}
.modal-body{--form-gap:16px; padding:20px 22px; display:flex; flex-direction:column; gap:var(--form-gap);}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line-soft); display:flex; justify-content:flex-end; gap:10px; position:sticky; bottom:0; z-index:4; background:var(--surface);}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:13px; font-weight:700; color:var(--ink-soft);}
.field input[type=text], .field input[type=date], .field input[type=number], .field textarea, .field select{padding:10px 11px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:16px; font-family:inherit; width:100%;}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:flex; gap:var(--form-gap, 12px); flex-wrap:wrap;}
.quick-add-option{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:16px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer;}
.quick-add-option:hover{border-color:var(--accent); background:var(--accent-soft);}
.quick-add-option .qa-icon{font-size:26px; flex-shrink:0; line-height:1;}
.quick-add-option .qa-text{display:flex; flex-direction:column; gap:2px;}
.quick-add-option .qa-title{font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:var(--ink);}
.quick-add-option .qa-sub{font-size:12.5px; color:var(--ink-soft);}
.field-row .field{flex:1 1 180px; min-width:0;}
.field input, .field select, .field textarea{min-width:0; max-width:100%;}
/* iPhone date inputs keep a native minimum width and spill into the next field unless their native look is reset. */
@supports (-webkit-touch-callout: none){
  .field input[type=date]{-webkit-appearance:none; appearance:none; min-height:44px; text-align:left;}
  .field input[type=date]::-webkit-date-and-time-value{text-align:left;}
}
.chip-select{display:flex; flex-wrap:wrap; gap:6px;}
.chip-select button{padding:6px 11px; border-radius:99px; border:1px solid var(--line); background:var(--surface-2); font-size:12px; font-weight:700; color:var(--ink-soft);}
.chip-select button.on{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:800;}
.category-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.category-option{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:20px 10px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; text-align:center;}
.category-option:hover{border-color:var(--accent); background:var(--accent-soft);}
.category-option .cat-icon{font-size:28px; line-height:1;}
.category-option .cat-label{font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--ink);}
.wizard-back{margin-right:6px;}
.photo-row{display:flex; gap:10px; flex-wrap:wrap;}
.photo-thumb{width:76px; height:76px; border-radius:10px; overflow:hidden; position:relative; border:1px solid var(--line);}
.photo-thumb img{width:100%; height:100%; object-fit:cover;}
.photo-thumb .rm{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; line-height:1;}
.addphoto-btn{width:76px; height:76px; border-radius:10px; border:1.5px dashed var(--line); background:var(--surface-2); color:var(--ink-faint); font-size:20px; display:flex; align-items:center; justify-content:center;}
.wr-row{display:flex; gap:8px;}
.wr-row button{flex:1; min-height:44px; padding:9px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); font-weight:700; font-size:13.5px; color:var(--ink-soft);}
.toggle-btn{width:100%; min-height:44px; padding:9px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); font-weight:700; font-size:13.5px; color:var(--ink-soft); text-align:center;}
.toggle-btn.on{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
.wr-row button.on-yes{background:var(--olive-soft); color:var(--olive); border-color:transparent;}
.wr-row button.on-maybe{background:var(--gold-soft); color:var(--gold); border-color:transparent;}
.wr-row button.on-no{background:var(--accent-soft); color:var(--accent); border-color:transparent;}

/* detail drawer */
.detail-hero{position:relative; height:200px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:5px; color:var(--ink);}
.detail-hero img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
.detail-hero .dh-icon{font-size:50px; line-height:1;}
.detail-hero .dh-cat{font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; opacity:.85;}
button.fav-badge{border:none; padding:0; cursor:pointer; font:inherit;}
.detail-cta{width:100%; justify-content:center; padding:13px 16px; font-size:14.5px;}
.detail-actions-secondary{display:flex; gap:8px; flex-wrap:wrap;}
.tag-accent{background:var(--accent-soft) !important; color:var(--accent) !important;}
.detail-note{background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 10px 10px 0; padding:10px 14px; margin:0; font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:var(--ink-soft); line-height:1.45;}
.partner-part{border:1px dashed var(--line); border-radius:12px; padding:13px 14px;}
.partner-part summary{cursor:pointer; font-size:13.5px; font-weight:700; color:var(--accent);}
.partner-part[open] summary{margin-bottom:var(--form-gap);}
.partner-fields{display:flex; flex-direction:column; gap:var(--form-gap);}
/* The form's section wrappers step aside so every field shares the pop-up's gap. */
#personPartsWrap, #favFieldWrap, #categoryFieldsWrap{display:contents;}
.field input[type=text], .field input[type=number], .field input[type=date], .field select{min-height:44px;}
.join-note{background:var(--accent-soft); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.45;}
.btn-link{background:none; border:none; padding:0; color:var(--accent); font-weight:700; font-size:13px; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
.btn-text-danger{background:none; border:none; color:var(--ink-faint); font-size:12px; cursor:pointer; padding:4px 2px; text-decoration:underline; text-underline-offset:2px; align-self:flex-start;}
.btn-text-danger:hover{color:var(--accent);}
.visit-item{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:var(--surface); transition:border-color .18s ease, box-shadow .18s ease;}
.visit-item:hover{border-color:var(--ink-faint); box-shadow:var(--shadow);}
.visit-item .vhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:6px;}
.visit-item .vdate{font-family:'Caveat',cursive; font-size:19px; font-weight:600; color:var(--ink);}
.visit-photos{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.visit-photos img{width:64px; height:64px; object-fit:cover; border-radius:8px; cursor:zoom-in;}

/* wrapped */
.wrap-slide{background:linear-gradient(160deg, var(--accent-soft), var(--gold-soft)); color:var(--ink); border-radius:22px; padding:44px 36px; min-height:320px; display:flex; flex-direction:column; justify-content:center; gap:10px; box-shadow:var(--shadow);}
.wrap-slide .k{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; opacity:.85;}
.wrap-slide .big{font-family:'Fraunces',serif; font-size:42px; font-weight:600; line-height:1.08;}
.wrap-slide .foot{font-size:14px; opacity:.9;}
.wrap-nav{display:flex; justify-content:center; gap:10px; margin-top:16px;}
.wrap-dot{width:8px; height:8px; border-radius:50%; background:var(--line); border:none;}
.wrap-dot.on{background:var(--accent);}

.section-title{font-family:'Caveat',cursive; font-size:25px; font-weight:600; color:var(--accent); margin:24px 0 10px; line-height:1.1;}
.section-title:first-child{margin-top:0;}
.cat-stat-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow);}
.cat-stat-card .cs-head{display:flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin-bottom:10px;}
.cat-stat-card .cs-row{display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); padding:6px 0; border-top:1px solid var(--line-soft);}
.cat-stat-card .cs-row:first-of-type{border-top:none;}

/* journal */
.journal-sub{font-family:'Caveat',cursive; font-size:23px; font-weight:600; color:var(--accent); margin-top:2px;}
.journal-month{display:flex; align-items:center; gap:12px; margin:28px 0 2px; font-family:'Caveat',cursive; font-size:30px; font-weight:600; color:var(--ink);}
.journal-month::after{content:""; flex:1; height:1px; background:var(--line);}
.month-recap{margin:0 0 8px;}
.your-turn{position:relative; background:var(--accent-soft); padding:20px 16px 14px; margin:6px 0 18px; box-shadow:var(--shadow); transform:rotate(-.5deg);}
.yt-title{font-family:'Caveat',cursive; font-size:26px; font-weight:600; letter-spacing:.02em; line-height:1; color:var(--accent); margin-bottom:8px;}
.yt-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid rgba(200,68,106,.16);}
.yt-text{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink); min-width:0;}
.push-prompt{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--surface); border:1px dashed var(--line); border-radius:14px; padding:12px 14px; margin:0 0 14px; font-size:14px; color:var(--ink-soft);}
.pp-actions{display:flex; gap:6px;}
.set-note{font-size:12px; color:var(--ink-faint); margin:8px 0 0;}
#btnPushTest{margin-top:8px;}
.mr-best{display:block; border:none; background:none; padding:0; margin-top:10px; text-align:left; font-family:'Caveat',cursive; font-size:21px; font-weight:600; letter-spacing:.02em; line-height:1.2; color:var(--ink-soft); cursor:pointer;}
.mr-best b{font-weight:600; color:var(--accent);}
.mr-best svg{vertical-align:-1px;}
.jentry{display:grid; grid-template-columns:56px minmax(0,1fr); gap:12px; margin-top:14px;}
.jdate{text-align:center; padding-top:6px;}
.jday{font-family:'Fraunces',serif; font-size:30px; font-weight:500; line-height:1;}
.jwk{font-family:'Caveat',cursive; font-size:20px; font-weight:600; color:var(--ink-soft);}
.jcard{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
.jcard::after{content:""; display:block; clear:both;}
.jcard[data-open-restaurant]{cursor:pointer;}
.jcard[data-open-restaurant]:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:var(--accent);}
.jname{font-family:'Fraunces',serif; font-size:19px; font-weight:500; line-height:1.2;}
.jmeta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.jratings{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:8px;}
.jwho{font-size:12.5px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;}
.jnone{font-size:12px; color:var(--ink-faint);}
.wr-pill{display:inline-block; font-size:10.5px; font-weight:800; line-height:1.4; padding:1px 8px; border-radius:99px; white-space:nowrap;}
.wr-pill.yes{background:var(--olive-soft); color:var(--olive);}
.wr-pill.maybe{background:var(--gold-soft); color:var(--gold);}
.wr-pill.no{background:var(--accent-soft); color:var(--accent);}
.wr-under{margin-top:4px;}
.jquote{font-family:'Caveat',cursive; font-size:20px; font-weight:500; line-height:1.3; color:var(--ink-soft); margin-top:8px;}
.jline{font-size:12.5px; color:var(--ink-soft); margin-top:5px;}
.tape{display:inline-block; font-size:12px; padding:2px 10px; margin:8px 6px 0 0; color:var(--ink);}
.polaroid{float:right; background:#fff; padding:6px 6px 18px; border:1px solid var(--line); box-shadow:var(--shadow); margin:0 0 8px 14px; width:112px;}
.polaroid img{display:block; width:100%; height:92px; object-fit:cover;}
.polaroid-stack{float:right; position:relative; width:112px; height:132px; margin:0 0 10px 16px; cursor:zoom-in;}
.polaroid-stack .polaroid{position:absolute; top:0; left:0; float:none; margin:0; transition:transform .25s cubic-bezier(.2,.8,.2,1);}
.polaroid-stack:hover .polaroid:nth-child(2){transform:rotate(10deg) translate(10px,-2px) !important;}
.polaroid-stack:hover .polaroid:nth-child(3){transform:rotate(-11deg) translate(-10px,2px) !important;}
.ps-count{position:absolute; left:0; right:0; bottom:-4px; text-align:center; font-family:'Caveat',cursive; font-size:17px; font-weight:600; color:var(--ink-soft);}
.jmini-photo-wrap{position:relative; cursor:zoom-in;}
.ps-badge,.p-count{position:absolute; bottom:6px; right:6px; background:rgba(20,16,24,.62); color:#fff; font-size:11px; font-weight:800; border-radius:99px; padding:2px 8px;}
.dh-photo{cursor:zoom-in;}
.photo-hint{flex-basis:100%; font-family:'Caveat',cursive; font-size:18px; font-weight:600; color:var(--ink-faint);}
.viewer{position:fixed; inset:0; z-index:150; background:rgba(20,16,24,.9); display:flex; align-items:center; justify-content:center; padding:24px 76px; animation:whos-in .2s ease;}
.pv-frame{margin:0; background:#fff; padding:12px 12px 14px; box-shadow:0 24px 60px rgba(0,0,0,.45); max-width:min(92vw, 920px); transform:rotate(-1deg);}
.pv-frame img{display:block; max-width:100%; max-height:74vh; margin:0 auto; object-fit:contain;}
.pv-frame figcaption{display:flex; justify-content:space-between; gap:14px; font-family:'Caveat',cursive; font-size:22px; font-weight:600; color:#33283A; margin-top:10px;}
.pv-count{color:#9C8E9F; white-space:nowrap;}
.pv-nav{position:absolute; top:50%; transform:translateY(-50%); width:50px; height:50px; border-radius:50%; border:none; background:rgba(255,255,255,.14); color:#fff; font-size:30px; line-height:1;}
.pv-nav:hover{background:rgba(255,255,255,.28);}
.pv-prev{left:16px;} .pv-next{right:16px;}
.pv-close{position:absolute; top:calc(16px + env(safe-area-inset-top)); right:16px; width:44px; height:44px; border-radius:50%; border:none; background:rgba(255,255,255,.14); color:#fff; font-size:16px;}
.pv-close:hover{background:rgba(255,255,255,.28);}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:3px;}
[role="button"]{cursor:pointer;}
.shortcuts{display:flex; flex-direction:column; gap:8px;}
.sc-row{display:flex; align-items:center; gap:14px; font-size:14px; color:var(--ink-soft);}
.sc-row kbd{min-width:118px; font-family:'Nunito',sans-serif; font-size:12.5px; font-weight:800; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:7px; padding:4px 9px; text-align:center;}
.jday-title{font-family:'Caveat',cursive; font-size:24px; font-weight:600; color:var(--accent);}
.jmini-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-top:8px;}
.jmini{background:var(--surface-2); border-radius:12px; padding:10px 12px; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease;}
.jmini:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
.jmini-photo{display:block; width:100%; height:90px; object-fit:cover; border-radius:8px; margin-bottom:8px;}
.sticky-note{display:block; width:100%; max-width:340px; text-align:left; background:var(--gold-soft); border:none; border-radius:4px; padding:14px 16px 16px; margin:28px 0 0 68px; transform:rotate(-1deg); box-shadow:var(--shadow); color:var(--ink); transition:transform .2s ease;}
.sticky-note:hover{transform:rotate(0deg) translateY(-2px);}
.sticky-title{font-family:'Caveat',cursive; font-size:25px; font-weight:600;}
.sticky-body{font-size:13px; color:var(--ink-soft); margin-top:2px;}

/* trips */
.postcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:22px; padding:6px 4px;}
.postcard{position:relative; border-radius:8px; padding:18px 18px 16px; min-height:180px; box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; gap:3px; transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease;}
.postcard:hover{transform:rotate(0deg) translateY(-5px) scale(1.02) !important; box-shadow:var(--shadow-lift);}
.pc-stamp{position:absolute; top:12px; right:12px; width:46px; height:54px; border:2px dashed var(--accent); border-radius:4px; background:var(--surface); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:22px; transform:rotate(7deg);}
.pc-status{font-family:'Caveat',cursive; font-size:21px; font-weight:600; color:var(--accent);}
.pc-dest{font-family:'Fraunces',serif; font-size:28px; font-weight:500; line-height:1.1; padding-right:58px;}
.pc-dates{font-size:12.5px; color:var(--ink-soft);}
.pc-progress{margin-top:auto; padding-top:14px;}
.pc-bar{height:7px; background:var(--surface); border-radius:99px; overflow:hidden;}
.pc-bar span{display:block; height:100%; background:var(--accent); border-radius:99px;}
.pc-count{font-family:'Caveat',cursive; font-size:18px; font-weight:600; color:var(--ink-soft); margin-top:3px;}
.trip-cover{position:relative; border-radius:10px; padding:22px 22px 18px; box-shadow:var(--shadow);}
.trip-cover .tc-stamp{width:58px; height:68px; font-size:28px; top:16px; right:18px;}
.tc-dest{font-size:36px; font-weight:500; line-height:1.05; padding-right:70px;}
.tc-notes{font-family:'Caveat',cursive; font-size:21px; color:var(--ink-soft); margin-top:6px; line-height:1.25;}
.tc-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.section-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:24px 0 10px;}
.section-row .section-title{margin:0;}
.stamps{display:flex; flex-wrap:wrap; gap:12px;}
.stamp{position:relative; width:54px; height:54px; border-radius:50%; border:2px dashed var(--line); background:var(--surface); font-size:22px; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; transition:transform .2s ease;}
.stamp.done{border:2px solid var(--accent); background:var(--accent-soft); transform:rotate(-10deg);}
.stamp.done::after{content:"✓"; position:absolute; right:-4px; bottom:-4px; width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.stamp:hover{transform:scale(1.12) rotate(0deg);}
.stamp-caption{font-family:'Caveat',cursive; font-size:20px; font-weight:600; color:var(--ink-soft); margin-top:8px;}
.bucket-item{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; transition:transform .2s ease, box-shadow .2s ease, border-color .15s ease;}
.bi-box{width:22px; height:22px; border:2px solid var(--line); border-radius:6px; flex-shrink:0;}
.bi-main{flex:1; min-width:0; cursor:pointer;}
.bi-name{font-family:'Fraunces',serif; font-size:16px; font-weight:500;}
.bi-meta{font-size:12px; color:var(--ink-soft);}
.bucket-item.flash{border-color:var(--accent); background:var(--accent-soft);}
.bucket-item.picked{border-color:var(--accent); box-shadow:var(--shadow-lift); transform:scale(1.02);}
.bucket-item.picked .bi-main::after{content:"how about this one?"; display:block; font-family:'Caveat',cursive; font-size:19px; font-weight:600; color:var(--accent);}
.trip-day{display:flex; align-items:center; gap:12px; margin:22px 0 10px; font-family:'Caveat',cursive; font-size:26px; font-weight:600;}
.trip-day::after{content:""; flex:1; height:1px; background:var(--line);}

/* people: Kat is rose, Albie is sky, everywhere a person shows up */
.who-dot{width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-family:'Nunito',sans-serif; font-size:10px; font-weight:800; flex-shrink:0;}
.who-a{background:var(--accent-soft); color:var(--accent);}
.who-b{background:var(--tint-5); color:#2E5A86;}
:root[data-theme="dark"] .who-b{color:#A9CBEB;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .who-b{color:#A9CBEB;} }

/* pinboard */
.board-toolbar .btn{padding:9px 14px;}
.bchips{display:flex; gap:7px; overflow-x:auto; padding:2px 2px 8px; margin:0 -2px 4px; scrollbar-width:none;}
.bchips::-webkit-scrollbar{display:none;}
.bchip{flex-shrink:0; display:inline-flex; align-items:center; gap:5px; padding:6px 13px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-size:13px; font-weight:700; white-space:nowrap;}
.bchip:hover{border-color:var(--ink-faint); color:var(--ink);}
.bchip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.bchip .n{font-weight:600; opacity:.7;}
.bchips .sep{flex-shrink:0; width:1px; background:var(--line); margin:5px 3px;}
.board-hint{font-family:'Caveat',cursive; font-size:21px; font-weight:600; color:var(--ink-soft); margin:4px 0 8px;}
.board-zone{display:flex; align-items:center; gap:10px; margin:22px 0 2px; font-family:'Caveat',cursive; font-size:34px; font-weight:600; color:var(--ink); line-height:1.1;}
.board-zone .bz-count{font-family:'Nunito',sans-serif; font-size:13px; font-weight:800; color:var(--ink-soft); background:var(--surface-2); border-radius:99px; padding:3px 10px;}
.board-area{display:flex; align-items:center; gap:10px; margin:14px 0 14px; font-family:'Caveat',cursive; font-size:24px; font-weight:600; color:var(--ink-soft);}
.board-area::after{content:""; flex:1; height:1px; background:var(--line);}
.trip-tag{font-family:'Nunito',sans-serif; font-size:12px; font-weight:800; color:var(--accent); background:var(--accent-soft); border:none; border-radius:99px; padding:4px 10px;}
.board-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:26px 18px; padding-top:10px; margin-bottom:10px;}
.bitem{position:relative; cursor:pointer; transform:rotate(var(--tilt,0deg)); transition:transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease;}
.bitem:hover{transform:rotate(0deg) translateY(-4px) scale(1.02); box-shadow:var(--shadow-lift); z-index:3;}
.bitem.flash{box-shadow:0 0 0 3px var(--accent), var(--shadow-lift);}
.bitem.picked{transform:rotate(0deg) scale(1.03); box-shadow:0 0 0 3px var(--accent), var(--shadow-lift); z-index:3;}
.pick-label{font-family:'Caveat',cursive; font-size:20px; font-weight:600; color:var(--accent); line-height:1.1; margin-top:6px;}
.tape-strip{position:absolute; top:-10px; left:50%; width:60px; height:19px; margin-left:-30px; background:var(--tape); transform:rotate(-4deg); z-index:2;}
.heart-pin{position:absolute; top:-11px; left:50%; width:24px; height:24px; margin-left:-12px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; box-shadow:0 2px 5px rgba(0,0,0,.25); z-index:2;}
.note{padding:20px 14px 12px; min-height:140px; display:flex; flex-direction:column; box-shadow:var(--shadow); color:var(--ink);}
.n-name{font-family:'Caveat',cursive; font-size:26px; font-weight:600; line-height:1.08; color:var(--ink); overflow-wrap:anywhere;}
.n-meta{font-size:12px; color:var(--ink-soft); margin-top:7px; line-height:1.4;}
.added-by{display:flex; align-items:center; gap:6px; font-family:'Caveat',cursive; font-size:18px; font-weight:600; color:var(--ink-soft); margin-top:8px; line-height:1.2;}
.n-foot{margin-top:auto; padding-top:10px; display:flex; justify-content:flex-end;}
.n-went{border:none; background:var(--note-pill); color:var(--accent); font-size:12px; font-weight:800; padding:5px 10px; border-radius:99px;}
.n-went:hover{background:var(--surface);}
.km{font-size:11px; font-weight:800; color:var(--ink-soft);}
.note > .km{position:absolute; top:8px; right:9px;}
.polaroid-card{background:var(--surface); padding:8px 8px 12px; border:1px solid var(--line-soft); box-shadow:var(--shadow); color:var(--ink);}
.p-img{position:relative; height:110px; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:30px; background:var(--surface-2);}
.p-img img{width:100%; height:100%; object-fit:cover; display:block;}
.p-img .km{position:absolute; top:6px; right:6px; background:var(--surface); padding:1px 7px; border-radius:99px;}
.p-name{font-family:'Fraunces',serif; font-size:15.5px; font-weight:500; line-height:1.2; margin-top:9px;}
.p-stars{margin-top:4px;}
.p-meta{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
.where-opt{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); text-align:left; cursor:pointer;}
.where-opt:hover{border-color:var(--accent); background:var(--accent-soft);}
.where-opt .wo-name{font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:var(--ink);}
.where-opt .wo-count{font-family:'Caveat',cursive; font-size:19px; font-weight:600; color:var(--ink-soft);}
.where-opt.near{background:var(--accent-soft); border-color:transparent;}
.unplaced{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:14px; font-size:12.5px; color:var(--ink-soft);}
.unplaced .chip{cursor:pointer;}

/* maps, pinned to the board like a paper map */
.map-legend{display:flex; gap:14px; align-items:center; font-family:'Caveat',cursive; font-size:19px; font-weight:600; color:var(--ink-soft); margin:2px 0 16px;}
.lg-dot{display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:5px; vertical-align:-1px; border:2px solid var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.3);}
.lg-dot.been{background:var(--accent);}
.lg-dot.try{background:var(--star);}
.lg-heart{color:var(--accent);}
.paper-map{position:relative; background:var(--surface); padding:8px; border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow);}
.paper-map::before,.paper-map::after{content:""; position:absolute; top:-10px; width:76px; height:20px; background:var(--tape); z-index:5; pointer-events:none;}
.paper-map::before{left:14px; transform:rotate(-6deg);}
.paper-map::after{right:14px; transform:rotate(5deg);}
#boardMap{height:62vh; min-height:340px; width:100%; background:var(--surface-2); position:relative; overflow:hidden;}
#tripMap{height:300px; width:100%; background:var(--surface-2); position:relative; overflow:hidden;}
.map-card{position:absolute; left:20px; right:20px; bottom:20px; z-index:6; max-width:360px; margin:0 auto;}
.mc{position:relative; box-shadow:var(--shadow-lift); padding:14px 14px 12px;}
.mc.note{min-height:0;}
.mc-close{position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; border:none; background:var(--note-pill); color:var(--ink-soft); font-size:12px; z-index:2;}
.mc-body{display:flex; gap:12px; align-items:center; cursor:pointer; padding-right:26px;}
.mc-photo{width:64px; height:64px; object-fit:cover; flex-shrink:0;}
.mc-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:10px;}
.pushpin{position:relative; width:24px; height:32px; cursor:pointer; transform-origin:50% 100%; transition:transform .15s ease;}
.pp-head{position:absolute; top:0; left:2px; width:20px; height:20px; border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:0 2px 4px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; line-height:1;}
.pushpin.try .pp-head{background:var(--star);}
.pp-needle{position:absolute; left:11px; top:19px; width:2px; height:13px; border-radius:1px; background:#7d7080;}
.pushpin:hover,.pushpin.active{transform:scale(1.25);}
.pushpin.bounce{animation:pin-bounce .6s ease 3;}
@keyframes pin-bounce{0%,100%{transform:translateY(0) scale(1.25);} 45%{transform:translateY(-14px) scale(1.25);}}
.me-dot{width:14px; height:14px; border-radius:50%; background:#3B82F6; border:3px solid #fff; box-shadow:0 0 0 6px rgba(59,130,246,.22);}

/* lists, as notepad pages */
.notepads{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:30px 20px; padding-top:12px;}
.notepad{position:relative; display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); padding:22px 16px 36px 44px; min-height:200px; cursor:pointer; color:var(--ink); transform:rotate(var(--tilt,0deg)); transition:transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease;}
.notepad:hover{transform:rotate(0deg) translateY(-4px); box-shadow:var(--shadow-lift);}
.notepad::before{content:""; position:absolute; top:0; bottom:0; left:31px; width:2px; background:var(--accent-soft);}
.notepad.favs{background:var(--accent-soft);}
.notepad.favs::before,.list-page.favs::before{background:var(--accent); opacity:.25;}
.np-title{display:block; font-family:'Caveat',cursive; font-size:28px; font-weight:600; line-height:1.05; margin-bottom:8px;}
.np-line{display:flex; align-items:center; gap:9px; font-family:'Caveat',cursive; font-size:21px; font-weight:500; line-height:1.1; padding:5px 0; border-bottom:1px solid var(--line); min-width:0;}
.notepad.favs .np-line{border-bottom-color:rgba(200,68,106,.18);}
.np-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.np-empty{color:var(--ink-faint);}
.np-box{width:15px; height:15px; border:1.5px solid var(--ink-faint); border-radius:3px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; color:var(--accent); font-family:'Nunito',sans-serif; font-size:12px; font-weight:800; line-height:1;}
.np-box.done{border-color:var(--accent);}
.np-box.done::after{content:"✓";}
.np-more{font-family:'Caveat',cursive; font-size:19px; color:var(--ink-faint); margin-top:6px;}
.np-count{position:absolute; left:44px; bottom:12px; font-size:11.5px; font-weight:800; color:var(--ink-faint);}
.np-new{display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:4px; border-style:dashed; box-shadow:none; background:transparent;}
.np-new .np-title{color:var(--accent); margin:0;}
.np-ideas{font-family:'Caveat',cursive; font-size:19px; color:var(--ink-faint); line-height:1.15;}
.list-page{position:relative; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); padding:30px 22px 20px 60px; margin-top:6px;}
.list-page.favs{background:var(--accent-soft);}
.list-page::before{content:""; position:absolute; top:0; bottom:0; left:42px; width:2px; background:var(--accent-soft);}
.lp-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:10px;}
.lp-title{font-family:'Caveat',cursive; font-size:42px; font-weight:600; line-height:1;}
.lp-desc{font-family:'Caveat',cursive; font-size:21px; color:var(--ink-soft); margin-top:4px;}
.lp-progress{font-size:12px; font-weight:800; color:var(--ink-faint); margin-top:6px;}
.lp-actions{display:flex; gap:8px;}
.lp-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
.list-page.favs .lp-item{border-bottom-color:rgba(200,68,106,.18);}
.lp-item .np-box{width:18px; height:18px; font-size:14px;}
.lp-main{flex:1; min-width:0; cursor:pointer;}
.lp-name{font-family:'Caveat',cursive; font-size:25px; font-weight:600; line-height:1.12;}
.lp-meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.lp-vote{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:99px; padding:4px 10px; font-size:12px; font-weight:800;}
.lp-vote.on{background:var(--accent-soft); border-color:transparent; color:var(--accent);}
.lp-remove{border:none; background:transparent; color:var(--ink-faint); font-size:13px; padding:6px;}
.lp-remove:hover{color:var(--accent);}
.lp-empty{font-family:'Caveat',cursive; font-size:22px; color:var(--ink-faint); padding:14px 0 6px;}

/* stats, as a sticker book */
.stickers{display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:14px; margin:4px 0 22px;}
.stk{aspect-ratio:1; width:100%; max-width:118px; justify-self:center; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(var(--tilt,0deg)); box-shadow:var(--shadow); border:3px solid var(--surface); color:var(--ink); transition:transform .2s ease;}
.stk:hover{transform:rotate(0deg) scale(1.06);}
.stk-n{font-family:'Fraunces',serif; font-size:32px; font-weight:500; line-height:1;}
.stk-l{font-family:'Caveat',cursive; font-size:19px; font-weight:600; line-height:1; margin-top:2px; color:var(--ink-soft);}
.unwrap{position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; width:100%; padding:18px 22px; border:none; border-radius:16px; background:var(--accent); color:var(--accent-ink); text-align:left; cursor:pointer; box-shadow:var(--shadow); transition:transform .2s ease, box-shadow .2s ease;}
.unwrap:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift);}
.unwrap::before{content:""; position:absolute; top:0; bottom:0; right:34px; width:16px; background:rgba(255,255,255,.25);}
.uw-bow{font-size:30px; position:relative;}
.uw-title{display:block; font-family:'Fraunces',serif; font-size:21px; font-weight:600; line-height:1.15; position:relative;}
.uw-sub{display:block; font-family:'Caveat',cursive; font-size:20px; font-weight:600; position:relative;}
.uw-arrow{margin-left:auto; flex-shrink:0; font-size:22px; font-weight:800; position:relative; width:40px; text-align:center;}
.pod-wrap{margin-top:24px;}
.stats-duo{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:start;}
.critic{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); margin-top:24px;}
.critic .section-title{margin-top:0;}
.cr-row{display:flex; align-items:center; justify-content:space-around; margin:6px 0 12px;}
.cr-side{text-align:center;}
.cr-av{width:46px; height:46px; border-radius:50%; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:20px; font-weight:600;}
.cr-val{font-family:'Fraunces',serif; font-size:24px; font-weight:500;}
.cr-star{color:var(--star); font-size:18px;}
.cr-lbl{font-size:11.5px; color:var(--ink-faint);}
.cr-vs{font-family:'Caveat',cursive; font-size:26px; color:var(--ink-faint);}
.cr-meter{height:9px; border-radius:99px; background:var(--accent-soft); overflow:hidden;}
.cr-meter span{display:block; height:100%; background:var(--accent); border-radius:99px;}
.cr-note{font-size:12.5px; color:var(--ink-soft); margin-top:7px;}
.cr-verdict{font-family:'Caveat',cursive; font-size:23px; font-weight:600; color:var(--ink); margin-top:4px;}
.critic-empty{font-family:'Caveat',cursive; font-size:21px; color:var(--ink-faint);}
.podium{display:flex; align-items:flex-end; gap:12px; padding:0 4px;}
.pod-col{flex:1; min-width:0; text-align:center; cursor:pointer;}
.pod-crown{font-size:22px; line-height:1; margin-bottom:2px;}
.pod-name{font-family:'Fraunces',serif; font-size:14px; font-weight:500; line-height:1.2; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.pod-score{font-size:12px; font-weight:800; color:var(--star); margin:3px 0 6px;}
.pod-block{border-radius:10px 10px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:8px; font-family:'Fraunces',serif; font-size:26px; font-weight:500; color:var(--ink); transition:transform .2s ease;}
.pod-col:hover .pod-block{transform:translateY(-3px);}
.st-count{font-family:'Nunito',sans-serif; font-size:13px; font-weight:800; color:var(--ink-faint); margin-left:8px;}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:18px 10px;}
.bdg{display:flex; flex-direction:column; align-items:center; text-align:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; color:var(--ink);}
.bdg-disc{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; transform:rotate(var(--tilt,0deg)); transition:transform .2s ease;}
.bdg.earned .bdg-disc{box-shadow:var(--shadow); border:3px solid var(--surface);}
.bdg:not(.earned) .bdg-disc{border:2px dashed var(--line); filter:grayscale(1); opacity:.5;}
.bdg:hover .bdg-disc{transform:rotate(0deg) scale(1.08);}
.bdg-name{font-size:12.5px; font-weight:800; line-height:1.2;}
.bdg-prog{font-size:11.5px; color:var(--ink-faint); font-weight:700;}
.bdg-how{display:none; font-family:'Caveat',cursive; font-size:17px; line-height:1.1; color:var(--ink-soft);}
.bdg.show-how .bdg-how{display:block;}
.awards{display:flex; flex-wrap:wrap; gap:10px;}
.award{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 16px 10px 12px; cursor:pointer; box-shadow:var(--shadow);}
.aw-medal{font-size:26px;}
.aw-what{font-family:'Caveat',cursive; font-size:18px; font-weight:600; color:var(--accent); line-height:1;}
.aw-name{font-family:'Fraunces',serif; font-size:15px; font-weight:500;}
.dish-tapes{display:flex; flex-wrap:wrap; gap:14px 10px;}
.dish-tape{display:inline-flex; flex-direction:column; align-items:flex-start; border:none; padding:7px 14px 8px; transform:rotate(var(--tilt,0deg)); cursor:pointer; color:var(--ink); text-align:left; transition:transform .2s ease;}
.dish-tape:hover{transform:rotate(0deg) translateY(-2px);}
.dt-dish{font-family:'Caveat',cursive; font-size:22px; font-weight:600; line-height:1;}
.dt-where{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.months{display:flex; align-items:flex-end; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px 12px; box-shadow:var(--shadow); min-height:170px;}
.mo-col{flex:1; max-width:64px; display:flex; flex-direction:column; align-items:center; gap:5px;}
.mo-n{font-family:'Fraunces',serif; font-size:16px; font-weight:500;}
.mo-bar{width:100%; border-radius:8px 8px 3px 3px;}
.mo-lbl{font-family:'Caveat',cursive; font-size:19px; font-weight:600; color:var(--ink-soft); line-height:1;}
.mo-spend{font-size:11px; color:var(--ink-faint); font-weight:700;}

function relativeDate(d){
  if(!d) return "";

/* ---------- image compression ---------- */
function compressImage(file){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(){
      var img = new Image();
      img.onerror = reject;
      img.onload = function(){
        try{
          function tryQuality(maxDim, quality){
            var w=img.width, h=img.height;
            var scale = Math.min(1, maxDim/Math.max(w,h));
            var cw = Math.round(w*scale), ch = Math.round(h*scale);
            var canvas = document.createElement("canvas");
            canvas.width=cw; canvas.height=ch;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img,0,0,cw,ch);
            return canvas.toDataURL("image/jpeg", quality);
          }
          var attempts = [[1280,.72],[1100,.62],[950,.5],[800,.4],[650,.32]];
          var result = null;
          for(var i=0;i<attempts.length;i++){
            var d = tryQuality(attempts[i][0], attempts[i][1]);
            if(d.length < 260000){ result = d; break; }
            result = d;
          }
          resolve(result);
        }catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function initDb(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf("YOUR_")===0 || !window.firebase){
    state.dbReady=false; state.loading=false; return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
  }catch(e){ console.error("Firebase init failed", e); state.dbReady=false; state.loading=false; return; }

  // Keep a copy on the device so photos and entries download once instead of on every open.
  fs.enablePersistence({synchronizeTabs:true}).catch(function(err){ console.warn("Offline cache unavailable:", err && err.code); });
  firebase.auth().signInAnonymously().catch(function(err){ console.error("Anonymous sign-in failed", err); });
  firebase.auth().onAuthStateChanged(function(user){
    if(!user) return;
    state.db = fs; state.dbReady = true;
    fs.collection("restaurants").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=Object.assign({id:d.id},d.data()); });
      state.restaurants=m; markLoaded("restaurants"); scheduleRender();
    }, loadFailed);
    fs.collection("visits").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=Object.assign({id:d.id},d.data()); });
      state.visits=m; markLoaded("visits"); scheduleRender();
    }, loadFailed);
    fs.collection("lists").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=Object.assign({id:d.id},d.data()); });
      state.lists=m; scheduleRender();
    }, function(err){ console.error(err); });
    fs.collection("pushSubs").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=d.data(); });
      state.pushSubs=m;
    }, function(err){ console.error(err); });
    refreshMyPush().then(function(sub){ if(sub) savePushSub(sub); });
    fs.collection("photos").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=Object.assign({id:d.id},d.data()); });
      state.photos=m; indexPhotos(); scheduleRender();
    }, function(err){ console.error(err); });
    fs.collection("trips").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=Object.assign({id:d.id},d.data()); });
      state.trips=m; scheduleRender();
    }, function(err){ console.error(err); });
  });
}

/* ---------- push notifications ---------- */
// A nudge to the other person when one of you logs a visit. A device that turns this on stores its push
// subscription in Firestore under whoever uses that device, and api/notify does the sending.
var VAPID_PUBLIC_KEY = "BA6E426UxMLzXZqpilZimE6YeORrECneasX6WgygNDrRh8s6_QKhZF2L9jOr9T2oyPYUHglVBC95H0LJVwMNVYo";
var myPushEndpoint = null;
var swReg = null;   // set once the service worker registers; without it there is nothing to subscribe with
function pushSupported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function partnerOf(who){ return who==="A" ? "B" : "A"; }
function b64ToBytes(b64){
  var raw = atob((b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g,"+").replace(/_/g,"/"));
  var out = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}
function pushSubId(endpoint){
  var h = 0;
  for(var i=0;i<endpoint.length;i++) h = (h*31 + endpoint.charCodeAt(i)) | 0;
  return "s"+Math.abs(h)+"_"+endpoint.length;
}
function refreshMyPush(){
  if(!pushSupported() || !swReg) return Promise.resolve(null);
  return swReg.pushManager.getSubscription().then(function(sub){
    myPushEndpoint = sub ? sub.endpoint : null;
    return sub;
  });
}
function savePushSub(sub){
  var j = sub.toJSON();
  myPushEndpoint = j.endpoint;
  if(!state.dbReady) return Promise.resolve();
  return state.db.collection("pushSubs").doc(pushSubId(j.endpoint)).set({who:state.me||"A", endpoint:j.endpoint, keys:j.keys, device:navigator.userAgent.slice(0,140), updatedAt:new Date().toISOString()});
}
// Has to run from a tap: browsers only show the permission prompt in response to one.
function enablePush(){
  return Notification.requestPermission().then(function(perm){
    if(perm!=="granted") throw new Error("Notifications not allowed");
    if(!swReg) throw new Error("Service worker not registered");
    return navigator.serviceWorker.ready;
  }).then(function(reg){
    return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC_KEY)});
  }).then(savePushSub);
}
function disablePush(){
  return refreshMyPush().then(function(sub){
    if(!sub) return;
    var id = pushSubId(sub.endpoint);
    return sub.unsubscribe().then(function(){
      myPushEndpoint = null;
      if(state.dbReady) return state.db.doc("pushSubs/"+id).delete();
    });
  });
}
function sendPush(subs, msg){
  if(!subs.length) return Promise.resolve({sent:0});
  return fetch("/api/notify", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({subs:subs.map(function(x){ return {endpoint:x.endpoint, keys:x.keys}; })}, msg))})
    .then(function(r){ return r.json(); })
    .then(function(res){
      (res.gone||[]).forEach(function(endpoint){ if(state.dbReady) state.db.doc("pushSubs/"+pushSubId(endpoint)).delete(); });
      return res;
    });
}
function nudgePartner(rid, placeName){
  var partner = partnerOf(state.me||"A");
  var subs = Object.keys(state.pushSubs).map(function(k){ return state.pushSubs[k]; }).filter(function(x){ return x.who===partner; });
  sendPush(subs, {
    title: state.profiles[state.me||"A"]+" logged "+placeName,
    body: "Add your rating and notes while it's fresh.",
    url: "/?review="+encodeURIComponent(rid), tag: "review-"+rid

}

  if(Notification.permission==="denied") return '<p class="set-note">Notifications are blocked for keepsake in this device\'s settings. Allow them there, then come back.</p>';
  var on = !!myPushEndpoint && Notification.permission==="granted";
  return '<button type="button" class="toggle-btn'+(on?' on':'')+'" id="btnPushToggle">'+(on ? "On for "+esc(state.profiles[state.me||"A"])+" on this device" : "Turn on for this device")+'</button>'+

    var mine = v["rating"+me]!=null || !!visitNotes(v, me);

    return !mine && theirs;
  }).sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); })

  q = q.toLowerCase();
  var hay = [r.name, r.neighborhood, r.city].concat(r.cuisines||[]).concat(r.tags||[]).join(" ").toLowerCase();
  if(hay.indexOf(q)>=0) return true;
  var vs = visitsFor(r.id);

    return ((v.favDishA||"")+" "+(v.favDishB||"")+" "+(v.favDish||"")+" "+(v.dishes||[]).join(" ")+" "+(v.notes||"")+" "+(v.notesA||"")+" "+(v.notesB||"")).toLowerCase().indexOf(q)>=0;

function viewJournal(){
  var byDate = {};
  allVisits().forEach(function(v){
    if(!v.restaurantId || !state.restaurants[v.restaurantId]) return;
    var d = v.date || "";
    byDate[d] = byDate[d] || {};
    (byDate[d][v.restaurantId] = byDate[d][v.restaurantId] || []).push(v);
  });
  var dates = Object.keys(byDate).sort().reverse();
  var saved = allRestaurants().filter(function(r){ return !visitsFor(r.id).length; })
    .sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
  var placeIds = {}, meals = 0;
  dates.forEach(function(d){ Object.keys(byDate[d]).forEach(function(rid){ placeIds[rid] = 1; meals++; }); });
  var nPlaces = Object.keys(placeIds).length;
  var html = '<div class="page-head"><div><h1>Our food journal</h1>'+
    '<div class="journal-sub">'+(meals ? plural(nPlaces,"place")+", "+plural(meals,"meal")+", and "+saved.length+" still on our list" : "every meal we share, in one place")+'</div></div></div>';
  html += yourTurnHtml() + pushPromptHtml();
  if(!meals) return html + emptyState("✎","Your food journal starts here","Log your first visit and it'll show up here.") + stillOnListHtml(saved);
  // The month a place first shows up in, so a recap can count that month's new places.
  var firstMonth = {};
  dates.slice().reverse().forEach(function(d){ Object.keys(byDate[d]).forEach(function(rid){ if(!firstMonth[rid]) firstMonth[rid] = d.slice(0,7); }); });
  var months = [], byMonth = {};
  dates.forEach(function(d){
    var mk = d.slice(0,7);
    if(!byMonth[mk]){ byMonth[mk] = []; months.push(mk); }
    byMonth[mk].push({d:d, places:Object.keys(byDate[d]).map(function(rid){ return {r: state.restaurants[rid], v: displayVisitData(byDate[d][rid])}; })});
  });
  months.forEach(function(mk){
    html += '<div class="journal-month">'+esc(monthLabel(mk))+'</div>'+monthRecapHtml(mk, byMonth[mk], firstMonth);
    byMonth[mk].forEach(function(day){
      html += '<div class="jentry">'+journalDateHtml(day.d)+'<div>'+(day.places.length===1 ? journalCardHtml(day.places[0].r, day.places[0].v) : journalDayHtml(day.places))+'</div></div>';
    });
  });
  return html + stillOnListHtml(saved);
}
function monthRecapHtml(mk, days, firstMonth){
  var meals = 0, places = {}, ratings = [], spent = 0, splits = 0, best = null;
  days.forEach(function(day){
    day.places.forEach(function(p){
      meals++; places[p.r.id] = 1;
      var score = avg([p.v.ratingA, p.v.ratingB]);
      if(score!=null){ ratings.push(score); if(!best || score > best.score) best = {r:p.r, score:score}; }
      if(typeof p.v.price==="number") spent += p.v.price;
      if(wrAgreement(p.v)==="split decision") splits++;
    });
  });
  var nPlaces = Object.keys(places).length;
  var fresh = Object.keys(places).filter(function(rid){ return firstMonth[rid]===mk; }).length;
  var chips = [plural(meals,"meal")];
  if(nPlaces !== meals) chips.push(plural(nPlaces,"place"));
  if(fresh) chips.push(fresh+" new "+(fresh===1 ? "place" : "places"));
  if(ratings.length) chips.push(avg(ratings).toFixed(1)+" ★ average");
  if(spent) chips.push("$"+Math.round(spent)+" spent");
  if(splits) chips.push(plural(splits,"split decision"));
  return '<div class="month-recap">'+chips.map(function(c,i){
      return '<span class="tape tint-'+(i%5+1)+'" style="transform:rotate('+(i%2 ? 1.5 : -1.5)+'deg)">'+esc(c)+'</span>';
    }).join('')+
    (best && ratings.length > 1 ? '<button type="button" class="mr-best" data-open-restaurant="'+best.r.id+'">best of the month: <b>'+esc(best.r.name)+'</b> '+best.score.toFixed(1)+' '+starSvg("var(--star)", 15)+'</button>' : '')+
  '</div>';
