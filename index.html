/* ---------- PINBOARD ---------- */
// Browse, saved places and favourites in one place: a place starts as a sticky note and becomes a polaroid once it has a visit.
var NEAR_KM = 15;
function isTried(r){ return visitsFor(r.id).length > 0; }
function placeCity(r){ return r.city || "Somewhere"; }
function tiltFor(o){ return ((placeHash(o)%7)-3)*0.7; }
function kmBetween(a, b){
  var rad = Math.PI/180, dLat = (b.lat-a.lat)*rad, dLng = (b.lng-a.lng)*rad;
  var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 12742*Math.asin(Math.sqrt(h));
}
function kmLabel(km){ return km < 1 ? Math.max(50, Math.round(km*20)*50)+" m" : (km < 10 ? km.toFixed(1) : Math.round(km))+" km"; }
function boardStatusMatch(r, status){
  if(status==="try") return !isTried(r);
  if(status==="been") return isTried(r);
  if(status==="fav") return !!r.favorite;
  return true;
}
function boardAreas(){
  var counts = {};
  allRestaurants().forEach(function(r){ var c = placeCity(r); counts[c] = (counts[c]||0)+1; });
  return Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a] || a.localeCompare(b); }).map(function(c){ return {name:c, count:counts[c]}; });
}
function inBoardArea(r){ return !state.board.area || state.board.area==="near" || placeCity(r)===state.board.area; }
// Near me keeps places within NEAR_KM, closest first; if none are that close it falls back to the six nearest.
function boardPlaces(){
  var b = state.board;
  var list = allRestaurants().filter(function(r){
    return matchesSearch(r, state.search) && boardStatusMatch(r, b.status) && (!b.cat || categoryOf(r).id===b.cat) && inBoardArea(r);
  });
  if(b.area!=="near") return {list:list, km:{}};
  if(!state.myLoc) return {list:[], km:{}};
  var km = {}, located = list.filter(hasLoc);
  located.forEach(function(r){ km[r.id] = kmBetween(state.myLoc, r); });
  located.sort(function(a,c){ return km[a.id]-km[c.id]; });
  var close = located.filter(function(r){ return km[r.id] <= NEAR_KM; });
  return close.length ? {list:close, km:km} : {list:located.slice(0,6), km:km, far:located.length>0};
}
function boardOrder(list){
  var fresh = list.filter(function(r){ return !isTried(r); }).sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
  var been = list.filter(isTried).sort(function(a,b){ return (restaurantScore(b.id)||0)-(restaurantScore(a.id)||0) || (lastVisitDate(b.id)||"").localeCompare(lastVisitDate(a.id)||""); });
  return fresh.concat(been);
}
function placeKind(r){ return (r.cuisines||[])[0] || (r.tags||[])[0] || r.placeType || categoryOf(r).label; }
function whoDot(who){ return '<span class="who-dot who-'+String(who).toLowerCase()+'">'+esc((state.profiles[who]||"?").charAt(0).toUpperCase())+'</span>'; }
function addedByHtml(r, withDate){
  if(!state.profiles[r.createdBy]) return '';
  var when = withDate && r.createdAt && !isNaN(new Date(r.createdAt)) ? ' on '+fmtDate(localDateStr(new Date(r.createdAt))) : '';
  return '<div class="added-by">'+whoDot(r.createdBy)+'added by '+esc(state.profiles[r.createdBy])+esc(when)+'</div>';
}
function boardItemHtml(r, km){
  var cat = categoryOf(r), picked = state.pickedId===r.id;
  var where = [r.neighborhood || r.city, placeKind(r)].filter(Boolean).join(" · ");
  var top = r.favorite ? '<span class="heart-pin" title="Favourite">♥</span>' : '<span class="tape-strip"></span>';
  var dist = km!=null ? '<span class="km">'+kmLabel(km)+'</span>' : '';
  var pick = picked ? '<div class="pick-label">how about this one?</div>' : '';
  var attrs = ' data-board-item="'+r.id+'" data-open-restaurant="'+r.id+'" style="--tilt:'+tiltFor(r)+'deg"';
  if(!isTried(r)){
    return '<div class="bitem note '+placeTint(r)+(picked?' picked':'')+'"'+attrs+'>'+top+dist+
      '<div class="n-name">'+esc(r.name)+'</div>'+
      '<div class="n-meta">'+cat.icon+' '+esc(where)+'</div>'+
      addedByHtml(r)+pick+
      '<div class="n-foot"><button type="button" class="n-went" data-log-visit-for="'+r.id+'">+ we went</button></div>'+
    '</div>';
  }
  var photo = firstPhotoFor(r.id), score = restaurantScore(r.id), nPhotos = photosForVisits(visitsFor(r.id)).length;
  return '<div class="bitem polaroid-card'+(picked?' picked':'')+'"'+attrs+'>'+top+
    '<div class="p-img'+(photo?'':' '+placeTint(r))+'">'+(photo ? '<img src="'+photo+'" alt="" loading="lazy">' : cat.icon)+dist+
      (nPhotos > 1 ? '<span class="p-count">📷 '+nPhotos+'</span>' : '')+'</div>'+
    '<div class="p-name">'+esc(r.name)+'</div>'+
    (score!=null ? '<div class="p-stars">'+renderStarsDisplay(score)+'</div>' : '')+
    '<div class="p-meta">'+esc(where)+'</div>'+pick+
  '</div>';
}
function bchip(attr, val, label, on){ return '<button type="button" class="bchip'+(on?' on':'')+'" '+attr+'="'+esc(val)+'">'+label+'</button>'; }
function tripForPlaces(places){
  for(var i=0;i<places.length;i++){ var t = places[i].tripId && state.trips[places[i].tripId]; if(t) return t; }
  return null;
}
function viewPinboard(){
  var b = state.board, all = allRestaurants();
  var triedCount = all.filter(isTried).length;
  var res = boardPlaces(), list = res.list;
  lastBoardList = list;
  var html = '<div class="page-head"><div><h1>Our pinboard</h1><div class="journal-sub">'+(all.length ? triedCount+" visited, "+(all.length-triedCount)+" still on our list" : "every place we want to go")+'</div></div>'+
    '<button class="btn primary" id="btnAddWant">+ Pin a place</button></div>';
  html += '<div class="toolbar board-toolbar"><div class="search-box"><span class="sicon">'+SEARCH_ICON+'</span><input id="searchInput" type="text" placeholder="Search places, dishes, areas…" value="'+esc(state.search)+'"></div>'+
    '<div class="viewtoggle"><button data-board-mode="board" class="'+(state.boardMode==="board"?"active":"")+'">Board</button><button data-board-mode="map" class="'+(state.boardMode==="map"?"active":"")+'">Map</button></div>'+
    '<button type="button" class="btn" id="btnBoardPick">🎲 Pick for us</button></div>';

  // Chip counts follow the search and area, so they match what tapping the chip would show.
  var scope = all.filter(function(r){ return matchesSearch(r, state.search) && inBoardArea(r); });
  var inCat = scope.filter(function(r){ return !b.cat || categoryOf(r).id===b.cat; });
  var count = function(status){ return inCat.filter(function(r){ return boardStatusMatch(r, status); }).length; };
  html += '<div class="bchips">'+
    bchip("data-board-status","all",'All <span class="n">'+count("all")+'</span>', b.status==="all")+
    bchip("data-board-status","try",'To visit <span class="n">'+count("try")+'</span>', b.status==="try")+
    bchip("data-board-status","been",'Been <span class="n">'+count("been")+'</span>', b.status==="been")+
    bchip("data-board-status","fav",'♥ Faves <span class="n">'+count("fav")+'</span>', b.status==="fav");
  var cats = CATEGORIES.filter(function(c){ return scope.some(function(r){ return categoryOf(r).id===c.id; }); });
  if(cats.length > 1 || b.cat){
    html += '<span class="sep"></span>'+cats.map(function(c){ return bchip("data-board-cat", b.cat===c.id ? "" : c.id, c.icon+' '+esc(c.label), b.cat===c.id); }).join('');
  }
  html += '</div><div class="bchips">'+
    bchip("data-board-area","near",'📍 Near me', b.area==="near")+
    bchip("data-board-area","",'Everywhere', !b.area)+
    boardAreas().map(function(a){ return bchip("data-board-area", a.name, esc(a.name)+' <span class="n">'+a.count+'</span>', b.area===a.name); }).join('')+
  '</div>';

  var note = state.boardNote; state.boardNote = "";
  if(b.area==="near" && !state.myLoc) note = "Finding where you are…";
  else if(res.far) note = "Nothing within "+NEAR_KM+" km of you, so here are the closest.";
  if(note) html += '<div class="board-hint">'+esc(note)+'</div>';

  if(state.boardMode==="map"){
    var unplaced = list.filter(function(r){ return !hasLoc(r); });
    html += '<div class="map-legend"><span><i class="lg-dot been"></i>been</span><span><i class="lg-dot try"></i>to visit</span><span class="lg-heart">♥ favourite</span></div>'+
      '<div class="paper-map"><div id="boardMap"></div><div class="map-card" id="boardMapCard" hidden></div></div>';
    if(unplaced.length) html += '<div class="unplaced">Not on the map yet: '+unplaced.map(function(r){ return '<button type="button" class="chip" data-open-restaurant="'+r.id+'">'+esc(r.name)+'</button>'; }).join('')+'</div>';
    return html;
  }
  if(!list.length){
    if(b.area==="near" && !state.myLoc) return html;
    return html + emptyState("📌", all.length ? "Nothing pinned here" : "Your pinboard is empty",
      all.length ? "Try another filter, or pin a new place." : "Pin the places you want to visit. They turn into polaroids once you go.");
  }
  // Want to visit comes first and apart from Been there, so the places still to go are easy to scan.
  var ordered = b.area==="near" ? list : boardOrder(list);
  var zones = [
    {title:"Want to visit", icon:"📝", items:ordered.filter(function(r){ return !isTried(r); })},
    {title:"Been there", icon:"📸", items:ordered.filter(isTried)}
  ];
  var areaOrder = boardAreas().map(function(a){ return a.name; });
  zones.forEach(function(z){
    if(!z.items.length) return;
    html += '<div class="board-zone"><span>'+z.icon+' '+z.title+'</span><span class="bz-count">'+z.items.length+'</span></div>';
    if(b.area){
      html += '<div class="board-grid">'+z.items.map(function(r){ return boardItemHtml(r, res.km[r.id]); }).join('')+'</div>';
      return;
    }
    var groups = {}, cities = [];
    z.items.forEach(function(r){ var c = placeCity(r); if(!groups[c]){ groups[c] = []; cities.push(c); } groups[c].push(r); });
    cities.sort(function(x,y){ return areaOrder.indexOf(x)-areaOrder.indexOf(y); });
    cities.forEach(function(c){
      var t = tripForPlaces(groups[c]);
      html += '<div class="board-area"><span>'+esc(c)+'</span>'+(t ? '<button type="button" class="trip-tag" data-goto-trip="'+t.id+'">✈ '+esc(tripStatus(t).label)+'</button>' : '')+'</div>';
      html += '<div class="board-grid">'+groups[c].map(function(r){ return boardItemHtml(r); }).join('')+'</div>';
    });
  });
  return html;
}

// Pick for us only ever picks inside an area (a city or near me), so it can't suggest somewhere in another city.
function pickPool(){
  var list = boardPlaces().list;
  if(state.boardMode==="map") list = list.filter(hasLoc);
  if(state.board.status==="been" || state.board.status==="fav") return list;
  return list.filter(function(r){ return !isTried(r); });
}
function pickForUs(){
  var pool = pickPool();
  if(!pool.length){
    state.pickedId = null;
    state.boardNote = state.board.area==="near" ? "Nothing on our list near here yet." : "Nothing to pick from in "+state.board.area+" yet. Pin a few places first.";
    renderAll(); return;
  }
  var winner = pool[Math.floor(Math.random()*pool.length)];
  if(state.boardMode==="map"){ state.pickedId = winner.id; pickBounce = true; renderAll(); return; }
  var land = function(){
    state.pickedId = winner.id; renderAll();
    var el = document.querySelector(".bitem.picked");
    if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
  };
  var els = pool.map(function(r){ return document.querySelector('[data-board-item="'+r.id+'"]'); }).filter(Boolean);
  if(els.length < 2) return land();
  var spins = 0, lit = null;
  var spin = setInterval(function(){
    if(lit) lit.classList.remove("flash");
    lit = els[Math.floor(Math.random()*els.length)];
    lit.classList.add("flash");
    if(++spins >= 10){ clearInterval(spin); land(); }
  }, 90);
}
function modalPickWhere(){
  var opts = boardAreas().map(function(a){
    var fresh = allRestaurants().filter(function(r){ return placeCity(r)===a.name && !isTried(r); }).length;
    return '<button type="button" class="where-opt" data-pick-area="'+esc(a.name)+'"><span class="wo-name">'+esc(a.name)+'</span><span class="wo-count">'+fresh+' to visit</span></button>';
  }).join('');
  openModal('<div class="modal"><div class="modal-head"><h2>Where are we?</h2><button class="btn ghost small" data-close-modal="1">✕</button></div>'+
    '<div class="modal-body"><button type="button" class="where-opt near" data-pick-area="near"><span class="wo-name">📍 Near me</span><span class="wo-count">use my location</span></button>'+opts+'</div></div>');
}
function locateMe(then){
  if(!navigator.geolocation){
    state.board.area = ""; state.boardNote = "This browser can't share your location, so pick a city instead.";
    renderAll(); return;
  }
  renderAll();
  navigator.geolocation.getCurrentPosition(function(pos){
    state.myLoc = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    renderAll();
    if(then) then();
  }, function(){
    if(!state.myLoc){ state.board.area = ""; state.boardNote = "Couldn't get your location, so pick a city instead."; }
    renderAll();
  }, {timeout:10000, maximumAge:300000});
}

function emptyState(emoji,title,body){
  return '<div class="empty"><div class="emoji">'+emoji+'</div><h3>'+title+'</h3><p>'+body+'</p></div>';
}

/* ---------- MAP (Google Maps, pinboard style) ---------- */
// A new Google map is a billable map load, so one map is created and moved into whichever view needs it.
var sharedMap = null, sharedMapEl = null, mapMarkers = [], mapMarkerById = {}, mapPins = "", mapSlotId = null, meMarker = null, pickBounce = false;
function pushPinEl(r){
  var el = document.createElement("div");
  el.className = "pushpin "+(isTried(r) ? "been" : "try");
  el.innerHTML = '<span class="pp-head">'+(r.favorite ? "♥" : "")+'</span><span class="pp-needle"></span>';
  return el;
}
function mapCardHtml(r, picked){
  var tried = isTried(r), cat = categoryOf(r), score = restaurantScore(r.id), photo = firstPhotoFor(r.id);
  var where = [r.neighborhood || r.city, placeKind(r)].filter(Boolean).join(" · ");
  return '<div class="mc '+(tried ? 'polaroid-card' : 'note '+placeTint(r))+'">'+
    '<button type="button" class="mc-close" data-map-card-close="1" aria-label="Close">✕</button>'+
    '<div class="mc-body" data-open-restaurant="'+r.id+'">'+
      (tried && photo ? '<img class="mc-photo" src="'+photo+'" alt="">' : '')+
      '<div>'+(picked ? '<div class="pick-label">how about this one?</div>' : '')+
      '<div class="'+(tried ? 'p-name' : 'n-name')+'">'+esc(r.name)+'</div>'+
      (tried && score!=null ? '<div class="p-stars">'+renderStarsDisplay(score)+'</div>' : '')+
      '<div class="'+(tried ? 'p-meta' : 'n-meta')+'">'+(tried ? '' : cat.icon+' ')+esc(where)+'</div>'+(tried ? '' : addedByHtml(r))+'</div>'+
    '</div>'+
    '<div class="mc-actions"><button type="button" class="btn small" data-open-restaurant="'+r.id+'">Details</button>'+
      '<a class="btn small" href="'+esc(googleMapsUrl(r, true))+'" target="_blank" rel="noopener">'+DIRECTIONS_ICON+'Directions</a>'+
      '<button type="button" class="btn small primary" data-log-visit-for="'+r.id+'">'+(tried ? '+ Log again' : '+ We went')+'</button></div>'+
  '</div>';
}
function showMapCard(rid, bounce){
  var card = document.getElementById(mapSlotId+"Card"), r = state.restaurants[rid], m = mapMarkerById[rid];
  if(!card || !r || !m) return;
  state.mapCardId = rid;
  card.innerHTML = mapCardHtml(r, state.pickedId===rid);
  card.hidden = false;
  enhanceClickables(card);
  Object.keys(mapMarkerById).forEach(function(id){ mapMarkerById[id].el.classList.toggle("active", id===rid); });
  sharedMap.panTo({lat:r.lat, lng:r.lng});
  if(bounce){ m.el.classList.remove("bounce"); void m.el.offsetWidth; m.el.classList.add("bounce"); }
}
function hideMapCard(){
  state.mapCardId = null; state.pickedId = null;
  var card = document.getElementById(mapSlotId+"Card");
  if(card){ card.hidden = true; card.innerHTML = ""; }
  Object.keys(mapMarkerById).forEach(function(id){ mapMarkerById[id].el.classList.remove("active"); });
}
function renderPlacesMap(slotId, list){
  var slot = document.getElementById(slotId);
  if(!slot) return;
  loadMaps().then(function(g){
    if(!document.body.contains(slot)) return;
    if(!sharedMap){
      sharedMapEl = document.createElement("div");
      sharedMapEl.className = "gmap-fill";
      slot.appendChild(sharedMapEl);
      sharedMap = newMap(g, sharedMapEl, lastPlaceCenter(), 11);
      sharedMap.addListener("click", function(){ hideMapCard(); });
    } else {
      slot.appendChild(sharedMapEl);
    }
    if(mapSlotId !== slotId) state.mapCardId = null;
    mapSlotId = slotId;
    mapMarkers.forEach(function(m){ m.map = null; });
    mapMarkerById = {};
    var withLoc = list.filter(hasLoc);
    mapMarkers = withLoc.map(function(r){
      var el = pushPinEl(r);
      var marker = new g.Marker({map:sharedMap, position:{lat:r.lat, lng:r.lng}, title:r.name, gmpClickable:true, content:el});
      marker.addEventListener("gmp-click", function(){ state.pickedId = null; showMapCard(r.id); });
      mapMarkerById[r.id] = {marker:marker, el:el};
      return marker;
    });
    if(meMarker){ meMarker.map = null; meMarker = null; }
    var fitTo = withLoc.slice();
    if(slotId==="boardMap" && state.board.area==="near" && state.myLoc){
      var dot = document.createElement("div"); dot.className = "me-dot";
      meMarker = new g.Marker({map:sharedMap, position:state.myLoc, content:dot, title:"You are here"});
      fitTo.push(state.myLoc);
    }
    var pins = slotId+":"+fitTo.map(function(p){ return p.id || "me"; }).sort().join(",");
    var refit = pins !== mapPins;
    if(refit){ mapPins = pins; fitMapTo(g, sharedMap, fitTo); }
    var open = state.pickedId || state.mapCardId, bounce = pickBounce;
    pickBounce = false;
    // Panning while the map is still zooming to fit would cancel the zoom, so a refit waits until the map settles.
    if(open && mapMarkerById[open]){
      var shown = false, show = function(){ if(!shown){ shown = true; showMapCard(open, bounce); } };
      if(refit){ g.event.addListenerOnce(sharedMap, "idle", show); setTimeout(show, 1500); }
      else show();
    }
  }).catch(function(err){
    console.error("Map failed to load", err);
    slot.innerHTML = mapErrorHtml(mapsAuthFailed ? mapsAuthFailureText() : "Couldn't load the map. Check your connection and try again.");
  });
}

/* ---------- LISTS ---------- */

function viewListDetail(l){

/* ---------- TRIPS (trip journal) ---------- */
function tripDays(t){
  if(!t.startDate) return [];
  var end = t.endDate && t.endDate >= t.startDate ? t.endDate : t.startDate;
  var out = [], d = new Date(t.startDate+"T00:00:00"), last = new Date(end+"T00:00:00");
  while(d <= last && out.length < 60){ out.push(localDateStr(d)); d.setDate(d.getDate()+1); }
  return out;
}
function tripStatus(t){
  var days = tripDays(t), today = todayStr();
  if(!days.length) return {kind:"someday", label:"someday"};
  if(today < days[0]){ var n = daysBetween(today, days[0]); return {kind:"upcoming", label: n===1 ? "tomorrow!" : n+" days to go"}; }
  if(today > days[days.length-1]) return {kind:"past", label:"trip complete"};
  return {kind:"now", label:"day "+(days.indexOf(today)+1)+" of "+days.length};
}
function tripDateRange(t){
  if(!t.startDate) return "Dates not set";
  return fmtDate(t.startDate)+(t.endDate && t.endDate!==t.startDate ? " – "+fmtDate(t.endDate) : "");
}
function tripSpots(t){ return allRestaurants().filter(function(r){ return r.tripId===t.id; }); }
function tripVisitsFor(t, rid){
  var days = tripDays(t);
  return visitsFor(rid).filter(function(v){ return !days.length || days.indexOf(v.date)>=0; });
}
// Logging from a trip should land inside the trip's dates, or the visit won't appear on the trip.
function tripLogDate(t){
  var days = tripDays(t), today = todayStr();
  return !days.length || days.indexOf(today)>=0 ? today : days[0];
}
function tripTilt(t){ return (placeHash(t)%5)-2; }
function viewTrips(){
  if(state.activeTripId && state.trips[state.activeTripId]) return viewTripDetail(state.trips[state.activeTripId]);
  var order = {now:0, upcoming:1, someday:2, past:3};
  var trips = Object.keys(state.trips).map(function(k){ var t = state.trips[k]; return {t:t, s:tripStatus(t)}; })
    .sort(function(a,b){
      if(order[a.s.kind]!==order[b.s.kind]) return order[a.s.kind]-order[b.s.kind];
      var cmp = (a.t.startDate||"").localeCompare(b.t.startDate||"");
      return a.s.kind==="past" ? -cmp : cmp;
    });
  if(state.search){
    var qTrips = state.search.toLowerCase();
    trips = trips.filter(function(x){ return ((x.t.destination||"")+" "+(x.t.notes||"")).toLowerCase().indexOf(qTrips)>=0; });
  }
  var upcoming = trips.filter(function(x){ return x.s.kind==="upcoming" || x.s.kind==="now"; }).length;
  var html = '<div class="page-head"><div><h1>Our trips</h1><div class="journal-sub">'+
    (trips.length ? plural(trips.length,"trip")+(upcoming ? ", "+upcoming+" coming up" : "") : "every trip is a food trip")+
    '</div></div><button class="btn primary" id="btnNewTrip">+ New trip</button></div>';
  html += '<div class="toolbar"><div class="search-box"><span class="sicon">'+SEARCH_ICON+'</span><input id="searchInput" type="text" placeholder="Search trips…" value="'+esc(state.search)+'"></div></div>';
  if(!trips.length) return html + emptyState("✈","Plan your first food trip","Add a destination and the spots you want to visit there.");
  html += '<div class="postcards">'+trips.map(function(x){
    var t = x.t, spots = tripSpots(t);
    var tried = spots.filter(function(r){ return tripVisitsFor(t, r.id).length; }).length;
    var pct = spots.length ? Math.round(tried/spots.length*100) : 0;
    return '<div class="postcard '+placeTint(t)+'" data-open-trip="'+t.id+'" style="transform:rotate('+tripTilt(t)+'deg)">'+
      '<div class="pc-stamp">✈</div>'+

        '<div class="pc-count">'+(spots.length ? tried+" of "+plural(spots.length,"spot")+" visited" : "no spots yet")+'</div></div>'+
    '</div>';
  }).join('')+'</div>';

  html += '<div class="section-title">Our stamp card</div>'+

      return '<button type="button" class="stamp'+(isTried(r)?' done':'')+'" data-open-restaurant="'+r.id+'" title="'+esc(r.name)+'">'+categoryOf(r).icon+'</button>';
    }).join('')+'</div>'+
    '<div class="stamp-caption">'+tried.length+' of '+plural(spots.length,"spot")+' visited'+(toTry.length ? '' : ' — every stamp collected!')+'</div>';
  if(spots.some(hasLoc)) html += '<div class="paper-map" style="margin-top:22px;"><div id="tripMap"></div><div class="map-card" id="tripMapCard" hidden></div></div>';
  if(toTry.length){
    html += '<div class="section-row"><div class="section-title">Still to visit</div>'+
      (toTry.length > 1 ? '<button type="button" class="btn small" id="btnTripPick">🎲 Where to next?</button>' : '')+'</div>'+
      toTry.map(function(r){
        return '<div class="bucket-item" data-bucket="'+r.id+'">'+
          '<span class="bi-box"></span>'+
          '<div class="bi-main" data-open-restaurant="'+r.id+'"><div class="bi-name">'+categoryOf(r).icon+' '+esc(r.name)+'</div>'+
          '<div class="bi-meta">'+esc([r.neighborhood, r.placeType].filter(Boolean).join(" · "))+'</div></div>'+
          '<button type="button" class="btn small primary" data-log-visit-for="'+r.id+'" data-log-date="'+tripLogDate(t)+'">We went!</button>'+
        '</div>';
      }).join('');
  }
  var byDate = {};
  tried.forEach(function(r){
    tripVisitsFor(t, r.id).forEach(function(v){
      byDate[v.date] = byDate[v.date] || {};
      (byDate[v.date][r.id] = byDate[v.date][r.id] || []).push(v);
    });
  });
  var visitDates = Object.keys(byDate).sort();
  html += '<div class="section-title">Trip journal</div>';
  if(!visitDates.length){
    html += '<p class="stamp-caption" style="margin-top:0;">'+(s.kind==="upcoming" || s.kind==="someday" ? "The pages fill in once you're there. Tap \"We went!\" on a spot to add it." : "Tap \"We went!\" on a spot and it'll show up here, day by day.")+'</p>';
  }
  visitDates.forEach(function(d){
    var dayIdx = days.indexOf(d);
    html += '<div class="trip-day">'+(dayIdx>=0 ? 'Day '+(dayIdx+1)+' · ' : '')+esc(new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}))+'</div>';
    var places = Object.keys(byDate[d]).map(function(rid){ return {r:state.restaurants[rid], v:displayVisitData(byDate[d][rid])}; });
    html += places.length===1 ? journalCardHtml(places[0].r, places[0].v) : journalDayHtml(places);
  });
  return html + '<button type="button" class="btn-text-danger" data-delete-trip="'+t.id+'" style="margin-top:24px;">Delete this trip</button>';
}

/* ---------- STATS ---------- */
function computeStats(filterYear){
  var visits = allVisits().filter(function(v){ return v.restaurantId && (!filterYear || (v.date||"").slice(0,4)===filterYear); });
  var visitedRids = {}; visits.forEach(function(v){visitedRids[v.restaurantId]=1;});
  var restaurantCount = Object.keys(visitedRids).length;
  var cuisineCount = {}, neighborhoodCount = {}, restCount = {};
  visits.forEach(function(v){
    var r = state.restaurants[v.restaurantId]; if(!r) return;
    (r.cuisines||[]).forEach(function(c){ cuisineCount[c]=(cuisineCount[c]||0)+1; });
    if(r.neighborhood) neighborhoodCount[r.neighborhood]=(neighborhoodCount[r.neighborhood]||0)+1;
    restCount[r.id]=(restCount[r.id]||0)+1;
  });
  function top(obj){ var k=Object.keys(obj); if(!k.length) return null; k.sort(function(a,b){return obj[b]-obj[a];}); return {key:k[0], count:obj[k[0]]}; }
  var ratings = visits.map(function(v){return avg([v.ratingA,v.ratingB]);}).filter(function(v){return v!=null;});
  var spendByMonth = {};
  visits.forEach(function(v){ if(typeof v.price==="number"){ var mk=monthKey(v.date); spendByMonth[mk]=(spendByMonth[mk]||0)+v.price; } });
  var totalPhotos = 0; visits.forEach(function(v){ totalPhotos += photosForVisit(v).length; });
  var topRest = top(restCount);
  return {
    restaurantCount: restaurantCount,
    cuisineCount: Object.keys(cuisineCount).length,
    avgRating: avg(ratings),
    topCuisine: top(cuisineCount),
    topRestaurant: topRest ? state.restaurants[topRest.key] : null,
    topRestaurantCount: topRest ? topRest.count : 0,
    topNeighborhood: top(neighborhoodCount),
    totalVisits: visits.length,
    totalPhotos: totalPhotos,
    spendByMonth: spendByMonth
  };
}

// Compares the two of you only on meals you both rated, so neither average is skewed by places only one of you rated.
function criticCardHtml(){
  var shared = sharedRatings(), A = state.profiles.A, B = state.profiles.B;
  var html = '<div class="critic"><div class="section-title">Who\'s the tougher critic?</div>';
  if(!shared.length) return html+'<div class="critic-empty">Rate a meal together and we\'ll see who\'s pickier.</div></div>';
  var avgA = avg(shared.map(function(v){ return v.ratingA; })), avgB = avg(shared.map(function(v){ return v.ratingB; }));
  var agree = shared.filter(function(v){ return Math.abs(v.ratingA-v.ratingB) <= 0.5; }).length;
  var diff = avgA - avgB;
  var verdict = Math.abs(diff) < 0.05 ? "You rate exactly alike" : (diff > 0 ? B : A)+" is the tougher critic"+(Math.abs(diff) < 0.3 ? ", barely" : "");
  var split = shared.slice().sort(function(a,b){ return Math.abs(b.ratingA-b.ratingB)-Math.abs(a.ratingA-a.ratingB); })[0];
  function side(who, name, val){

      '<div class="cr-val">'+val.toFixed(1)+' <span class="cr-star">★</span></div><div class="cr-lbl">'+esc(name)+'\'s average</div></div>';
  }
  return html+'<div class="cr-row">'+side("A", A, avgA)+'<div class="cr-vs">vs</div>'+side("B", B, avgB)+'</div>'+
    '<div class="cr-meter"><span style="width:'+Math.round(agree/shared.length*100)+'%"></span></div>'+
    '<div class="cr-note">Within half a star on '+agree+' of the '+plural(shared.length,"meal")+' you both rated</div>'+
    '<div class="cr-verdict">'+esc(verdict)+'</div>'+
    (Math.abs(split.ratingA-split.ratingB) >= 1 ? '<div class="cr-note">Biggest split: '+esc(state.restaurants[split.restaurantId].name)+' ('+esc(A)+' '+split.ratingA+', '+esc(B)+' '+split.ratingB+')</div>' : '')+

  var counts = {}, spend = {};
  allVisits().forEach(function(v){
    if(!v.restaurantId || !state.restaurants[v.restaurantId] || !v.date) return;
    var mk = v.date.slice(0,7);
    counts[mk] = (counts[mk]||0)+1;
    if(typeof v.price==="number") spend[mk] = (spend[mk]||0)+v.price;
  });
  var months = Object.keys(counts).sort().slice(-8);
  if(!months.length) return '';
  var max = Math.max.apply(null, months.map(function(m){ return counts[m]; }));
  return '<div class="section-title">Our months</div><div class="months">'+months.map(function(m,i){
    return '<div class="mo-col"><div class="mo-n">'+counts[m]+'</div>'+
      '<div class="mo-bar tint-'+(i%5+1)+'" style="height:'+Math.max(14, Math.round(counts[m]/max*110))+'px"></div>'+
      '<div class="mo-lbl">'+esc(new Date(m+"-01T00:00:00").toLocaleDateString(undefined,{month:"short"}))+'</div>'+
      (spend[m] ? '<div class="mo-spend">$'+Math.round(spend[m])+'</div>' : '')+'</div>';
  }).join('')+'</div>';
}
function categoryCardsHtml(){
  var breakdown = categoryBreakdown(null);
  var savedByCat = {}; CATEGORIES.forEach(function(c){ savedByCat[c.id]=0; });
  allRestaurants().forEach(function(r){ if(!isTried(r)) savedByCat[categoryOf(r).id]++; });
  var cats = CATEGORIES.filter(function(c){
    return breakdown.some(function(b){ return b.cat.id===c.id; }) || savedByCat[c.id]>0;
  });
  if(cats.length < 2) return '';
  return '<div class="section-title">By category</div><div class="grid-cards">'+cats.map(function(c){
    var b = breakdown.filter(function(x){ return x.cat.id===c.id; })[0] || {cat:c, placeCount:0, visitCount:0, avgRating:null};
    return categoryStatCardHtml(b, savedByCat[c.id]);

}
function viewStats(){

/* ---------- WRAPPED ---------- */
var wrappedSlideIdx = 0;
function availableYears(){
  var set={};
  allVisits().forEach(function(v){ if(v.date) set[v.date.slice(0,4)]=1; });
  var y = Object.keys(set).sort().reverse();
  return y.length ? y : [String(new Date().getFullYear())];
}
function viewWrapped(){
  var years = availableYears();
  if(!state.wrappedYear || years.indexOf(state.wrappedYear)<0) state.wrappedYear = years[0];
  var s = computeStats(state.wrappedYear);
  var html = '<button class="btn ghost small" data-back-stats="1" style="margin-bottom:10px;">← Back to stats</button>'+
    '<div class="page-head"><div><h1>'+state.wrappedYear+' Wrapped</h1><div class="sub">Your year in meals</div></div>'+
    '<select id="wrappedYearSelect">'+years.map(function(y){return '<option value="'+y+'"'+(y===state.wrappedYear?" selected":"")+'>'+y+'</option>';}).join('')+'</select></div>';

  var slides = [];
  slides.push({k:"Meals logged together", big:String(s.totalVisits), foot:s.restaurantCount+" different restaurants"});
  var yearBreakdown = categoryBreakdown(state.wrappedYear);
  if(yearBreakdown.length>1) slides.push({k:"By category", breakdown:yearBreakdown});
  if(s.topRestaurant) slides.push({k:"Most visited", big:s.topRestaurant.name, foot:s.topRestaurantCount+" visits this year"});
  if(s.topCuisine) slides.push({k:"Top cuisine", big:s.topCuisine.key, foot:s.topCuisine.count+" meals"});
  if(s.avgRating!=null) slides.push({k:"Average rating", big:s.avgRating.toFixed(1)+" ★", foot:"across every visit logged"});
  if(s.topNeighborhood) slides.push({k:"Favourite neighbourhood", big:s.topNeighborhood.key, foot:s.topNeighborhood.count+" visits there"});
  slides.push({k:"Photos captured", big:String(s.totalPhotos), foot:"memories saved"});

  if(!s.totalVisits){
    html += emptyState("✦","No meals logged in "+state.wrappedYear,"Log a few visits this year to unlock your wrapped.");
    return html;
  }

  wrappedSlideIdx = clamp(wrappedSlideIdx,0,slides.length-1);
  var sl = slides[wrappedSlideIdx];
  if(sl.breakdown){
    html += '<div class="wrap-slide"><div class="k">'+esc(sl.k)+'</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px;margin:14px auto 0;width:100%;max-width:320px;">'+
      sl.breakdown.map(function(b){
        return '<div style="display:flex;justify-content:space-between;align-items:center;font-size:16px;"><span>'+b.cat.icon+' '+esc(b.cat.label)+'</span><span class="mono">'+b.visitCount+' visit'+(b.visitCount!==1?'s':'')+'</span></div>';
      }).join('')+
      '</div></div>';
  } else {
    html += '<div class="wrap-slide"><div class="k">'+esc(sl.k)+'</div><div class="big">'+esc(sl.big)+'</div><div class="foot">'+esc(sl.foot)+'</div></div>';
  }
  html += '<div class="wrap-nav">'+
    '<button class="btn small" data-wrap-prev="1">‹ Prev</button>'+
    slides.map(function(_,i){return '<button class="wrap-dot'+(i===wrappedSlideIdx?' on':'')+'" data-wrap-dot="'+i+'"></button>';}).join('')+
    '<button class="btn small" data-wrap-next="1">Next ›</button>'+
  '</div>';
  return html;
}

/* ---------- directions ---------- */
// Plain https links: on a phone they open the Google Maps or Apple Maps app when it's installed.
function placeQuery(r){
  if(r.address) return r.name+", "+r.address;
  if(hasLoc(r)) return r.lat+","+r.lng;
  return [r.name, r.neighborhood, r.city].filter(Boolean).join(", ");
}
function googleMapsUrl(r, directions){
  var q = encodeURIComponent(placeQuery(r));
  var id = r.placeId ? (directions ? "&destination_place_id=" : "&query_place_id=")+encodeURIComponent(r.placeId) : "";
  return directions ? "https://www.google.com/maps/dir/?api=1&destination="+q+id : "https://www.google.com/maps/search/?api=1&query="+q+id;
}
function appleMapsUrl(r){
  var dest = r.address || (hasLoc(r) ? r.lat+","+r.lng : placeQuery(r));
  return "https://maps.apple.com/?daddr="+encodeURIComponent(dest)+"&q="+encodeURIComponent(r.name||"");
}
var DIRECTIONS_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>';
function directionsRowHtml(r){
  var apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  return '<div class="dir-row"><span class="dir-label">get directions</span>'+
    '<a class="btn small" href="'+esc(googleMapsUrl(r, true))+'" target="_blank" rel="noopener">'+DIRECTIONS_ICON+'Google Maps</a>'+
    (apple ? '<a class="btn small" href="'+esc(appleMapsUrl(r))+'" target="_blank" rel="noopener">'+DIRECTIONS_ICON+'Apple Maps</a>' : '')+
  '</div>';
}

var geoSearchToken = 0;
var geoSessionToken = null;
function newGeoSessionToken(){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2); }
function doGeoSearch(){
  var input = document.getElementById("f_name");
  var q = input ? input.value.trim() : "";
  if(q.length < 3){ hideGeoSuggestions(); return; }
  if(!geoSessionToken) geoSessionToken = newGeoSessionToken();
  var myToken = ++geoSearchToken;
  fetch("/api/places-autocomplete?input="+encodeURIComponent(q)+"&sessiontoken="+encodeURIComponent(geoSessionToken))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(myToken !== geoSearchToken) return;
      renderGeoSuggestions((data && data.suggestions) || []);
    })
    .catch(function(){
      if(myToken !== geoSearchToken) return;
      var el = document.getElementById("geoSuggestions");
      if(el){ el.innerHTML = '<div class="geo-suggestion-empty">Search failed — check your connection.</div>'; el.classList.add("open"); }
    });
}
var debouncedGeoSearch = debounce(doGeoSearch, 400);
// Google's neighbourhood is often a broad district ("South Central Edmonton"); OSM names the actual one ("Garneau").
function fetchOsmNeighborhood(lat, lng){
  return fetch("https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat="+encodeURIComponent(lat)+"&lon="+encodeURIComponent(lng))
    .then(function(r){ return r.json(); })
    .then(function(res){
      var a = (res && res.address) || {};
      return a.neighbourhood || a.quarter || a.suburb || a.city_district || a.borough || "";
    })
    .catch(function(){ return ""; });
}
var geoSelectToken = 0;
function selectGeoCandidateFromResult(res){
  hideGeoSuggestions();
  var fName = document.getElementById("f_name");
  if(fName){ fName.value = res.mainText; fName.blur(); }
  var sessionToken = geoSessionToken || "";
  geoSessionToken = null;
  var myToken = ++geoSelectToken;
  fetch("/api/places-details?placeId="+encodeURIComponent(res.placeId)+"&sessiontoken="+encodeURIComponent(sessionToken))
    .then(function(r){ return r.json(); })
    .then(function(details){
      if(myToken !== geoSelectToken || !details || details.lat==null || details.lng==null) return;

function recentVisitMissingMyRating(rid){
  var me = state.me || "A";

  return visitsFor(rid)
    .filter(function(v){ return (v.date||"") >= cutoff && v["rating"+me]==null; })
    .sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); })[0] || null;

  ["favDishA","favDishB","notesA","notesB","favFinds","toLookFor","highlights","favExhibits"].forEach(function(k){ if(entry[k]) merged[k] = entry[k]; });
  ["photos","dishes","itemsPurchased"].forEach(function(k){

  });
  return merged;

function byCreatedAt(a,b){ return (a.createdAt||"").localeCompare(b.createdAt||""); }

  return saveVisit(mergeVisitData(vs), vs[0].id).then(function(){

  });
}
function displayVisitData(vs){
  return Object.assign(mergeVisitData(vs), {photos:photosForVisits(vs), visitIds:vs.map(function(v){ return v.id; })});
}
function mergeVisitData(vs){
  vs = vs.slice().sort(byCreatedAt);
  var merged = {ratingA:null, ratingB:null, wouldReturnA:null, wouldReturnB:null, wouldReturn:null, price:null, notes:"", notesA:"", notesB:"", photos:[], dishes:[], itemsPurchased:[]};
  var firstWins = ["favDish","favDishA","favDishB","favFinds","toLookFor","highlights","favExhibits"];
  firstWins.forEach(function(k){ merged[k] = ""; });
  vs.forEach(function(v){
    ["ratingA","ratingB","price"].forEach(function(k){ if(merged[k]==null && v[k]!=null) merged[k] = v[k]; });
    ["A","B"].forEach(function(who){ if(merged["wouldReturn"+who]==null && wrFor(v, who)) merged["wouldReturn"+who] = wrFor(v, who); });
    firstWins.forEach(function(k){ if(!merged[k] && v[k]) merged[k] = v[k]; });
    ["A","B"].forEach(function(who){ if(!merged["notes"+who]) merged["notes"+who] = visitNotes(v, who); });
    ["photos","dishes","itemsPurchased"].forEach(function(k){
      (v[k]||[]).forEach(function(x){ if(merged[k].indexOf(x)<0) merged[k].push(x); });
    });
  });
  return merged;
}

function exportAllData(){
  var payload = {
    exportedAt: new Date().toISOString(),
    profiles: state.profiles,
    restaurants: state.restaurants,
    visits: state.visits,
    photos: state.photos,
    lists: state.lists,
    trips: state.trips
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "keepsake-backup-"+todayStr()+".json";

var viewer = {photos:[], i:0, caption:""};

function renderPhotoViewer(){

function stepPhoto(d){

function closePhotoViewer(){ document.getElementById("viewerRoot").innerHTML = ""; }
var swipeX = null;
document.addEventListener("touchstart", function(e){ swipeX = document.getElementById("photoViewer") ? e.touches[0].clientX : null; }, {passive:true});
document.addEventListener("touchend", function(e){

        if(state.restaurants[ridResolved]) state.restaurants[ridResolved] = Object.assign({}, state.restaurants[ridResolved], {favorite:true});
        updateRestaurant(ridResolved, {favorite:true});
      } else if(kind2==="list"){
        var l = state.lists[cid]; var ids3 = (l.restaurantIds||[]).slice();
        if(ids3.indexOf(ridResolved)<0) ids3.push(ridResolved);
        updateList(cid, {restaurantIds:ids3});
      } else {
        updateRestaurant(ridResolved, {tripId: cid});
      }
      closeModal(); renderAll();
    }
    if(existingId){ withRid(existingId); return; }
    if(!newName) return;
    var dup = findDuplicateRestaurant(newName);
    if(dup){
      alert('"'+newName+'" is already saved — opening the existing entry instead.');
      closeModal(); modalRestaurantDetail(dup.id);
      return;
    }
    var newData = {name:newName, cuisines:[], tags:[]};
    if(kind2==="list" && cid===FAV_LIST_ID) newData.favorite = true;
    if(kind2==="trip"){
      newData.address = editingRestaurant.address || "";
      newData.placeId = editingRestaurant.placeId || "";
      newData.city = (document.getElementById("f_city")||{}).value || "";
      newData.neighborhood = (document.getElementById("f_nbhd")||{}).value || "";
      newData.lat = hasLoc(editingRestaurant) ? editingRestaurant.lat : null;
      newData.lng = hasLoc(editingRestaurant) ? editingRestaurant.lng : null;
    }
    saveRestaurant(newData).then(withRid);
    return;
  }


  var openWrapped = t.closest("[data-open-wrapped]");
  if(openWrapped){ state.showWrapped = true; state.wrappedYear = openWrapped.getAttribute("data-open-wrapped"); wrappedSlideIdx = 0; renderAll(); window.scrollTo(0,0); return; }
  if(t.closest("[data-back-stats]")){ state.showWrapped = false; renderAll(); return; }
  var badge = t.closest("[data-badge]");
  if(badge){ badge.classList.toggle("show-how"); return; }
  var wrapDot = t.closest("[data-wrap-dot]");
  if(wrapDot){ wrappedSlideIdx = parseInt(wrapDot.getAttribute("data-wrap-dot"),10); renderAll(); return; }
  if(t.closest("[data-wrap-prev]")){ wrappedSlideIdx = Math.max(0,wrappedSlideIdx-1); renderAll(); return; }
  if(t.closest("[data-wrap-next]")){ wrappedSlideIdx = wrappedSlideIdx+1; renderAll(); return; }

  if(t.id==="overlay"){ closeModal(); return; }
  if(t.closest("[data-close-modal]")){ closeModal(); return; }
});

document.addEventListener("keydown", function(e){
  var t = e.target, typing = t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.tagName==="SELECT" || t.isContentEditable);
  if(document.getElementById("photoViewer")){
    if(e.key==="Escape"){ closePhotoViewer(); e.preventDefault(); }
    else if(e.key==="ArrowLeft" || e.key==="ArrowRight"){ stepPhoto(e.key==="ArrowLeft" ? -1 : 1); e.preventDefault(); }
    return;
  }
  if((e.key==="Enter" || e.key===" ") && t && t.getAttribute && t.getAttribute("role")==="button" && t.tagName!=="BUTTON"){ e.preventDefault(); t.click(); return; }
  if(e.key==="Enter" && (e.metaKey || e.ctrlKey)){
    var save = document.querySelector("#modalRoot .modal-foot .btn.primary");
    if(save){ e.preventDefault(); save.click(); }
    return;
  }
  if(e.key==="Escape"){
    if(document.getElementById("overlay")){ closeModal(); e.preventDefault(); return; }
    if(document.getElementById("whosPicker") && localStorage.getItem("pp_me_chosen")){ hideWhoPicker(); return; }
    if(state.mapCardId){ hideMapCard(); return; }
    if(typing) t.blur();
    return;
  }
  // Single-key shortcuts stay out of the way while typing and leave the browser's own shortcuts alone.
  if(typing || e.metaKey || e.ctrlKey || e.altKey || document.getElementById("overlay") || document.getElementById("whosPicker")) return;
  var routes = {"1":"journal","2":"pinboard","3":"trips","4":"lists","5":"stats"};
  if(routes[e.key]){ e.preventDefault(); goRoute(routes[e.key]); return; }
  if(e.key==="n" || e.key==="N"){ e.preventDefault(); modalQuickAdd(); return; }
  if(e.key==="/"){ var search = document.getElementById("searchInput"); if(search){ e.preventDefault(); search.focus(); } return; }
  if((e.key==="p" || e.key==="P") && document.getElementById("btnBoardPick")){ e.preventDefault(); document.getElementById("btnBoardPick").click(); return; }
  if(e.key==="?"){ e.preventDefault(); modalShortcuts(); return; }
});
document.addEventListener("keydown", function(e){
  if(!e.target) return;
  if(e.target.id==="f_name" && document.getElementById("geoSuggestions") && e.key==="Enter"){
    e.preventDefault();
    if(geoResults.length) selectGeoCandidateFromResult(geoResults[0]);
  }
});
document.addEventListener("focusout", function(e){
  if(e.target && e.target.id==="f_name"){ setTimeout(hideGeoSuggestions, 150); }
});

document.addEventListener("input", function(e){
  if(e.target.id==="searchInput"){ state.search = e.target.value; debouncedRenderKeepFocus(); }
  if(e.target.id==="f_name" && document.getElementById("geoSuggestions")){ debouncedGeoSearch(); }
});
document.addEventListener("change", function(e){
  if(e.target.id==="wrappedYearSelect"){ state.wrappedYear = e.target.value; wrappedSlideIdx=0; renderAll(); }
  if(e.target.id==="f_photoInput"){
    var files = Array.prototype.slice.call(e.target.files||[]);
    var room = MAX_PHOTOS - editingVisit.photoItems.length;
    e.target.value = "";
    if(files.length > room) alert("A visit can hold "+MAX_PHOTOS+" photos, so only the first "+Math.max(room,0)+" were added.");
    files.slice(0, Math.max(room,0)).reduce(function(chain, file){
      return chain.then(function(){ return compressImage(file); }).then(function(dataUrl){
        editingVisit.photoItems.push({data:dataUrl});
        var row = document.getElementById("photoRow"); if(row) row.innerHTML = photoRowHtml();
      });
    }, Promise.resolve()).catch(function(){ alert("Couldn't process one of those photos. Try a different file."); });
  }
});
var debouncedRenderKeepFocus = debounce(function(){
  var active = document.activeElement, id = active && active.id, selStart = active && active.selectionStart;
  renderAll();
  if(id){ var el = document.getElementById(id); if(el){ el.focus(); if(selStart!=null && el.setSelectionRange){ try{el.setSelectionRange(selStart,selStart);}catch(e){} } } }
}, 180);

function refreshWrRow(){
  document.querySelectorAll(".wr-row[data-wr-who]").forEach(function(row){
    var key = "wouldReturn"+row.getAttribute("data-wr-who");
    row.querySelectorAll("button").forEach(function(b){
      var w = b.getAttribute("data-set-wr");
      b.className = editingVisit[key]===w ? "on-"+w : "";
    });
  });
}
function refreshChipUI(){
  document.querySelectorAll("[data-toggle-chip]").forEach(function(b){
    var kind=b.getAttribute("data-toggle-chip"), val=b.getAttribute("data-val");
    var arr = kind==="cuisine"?editingRestaurant.cuisines:editingRestaurant.tags;
    b.className = arr.indexOf(val)>=0 ? "on" : "";
  });
  document.querySelectorAll("[data-set-price]").forEach(function(b){
    b.className = parseInt(b.getAttribute("data-set-price"),10)===editingRestaurant.priceRange ? "on" : "";
  });
}

function doSaveRestaurantFromForm(){
  var name = document.getElementById("f_name").value.trim();
  if(!name){ alert("Give this place a name."); return; }
  if(!editingRestaurant.id){
    var dup = findDuplicateRestaurant(name);
    if(dup){
      alert('"'+name+'" is already saved — opening the existing entry instead.');
      closeModal(); modalRestaurantDetail(dup.id);
      return;
    }
  }
  var categoryId = document.getElementById("f_category").value;
  var data = {
    name: name,
    category: categoryId,
    placeType: (document.getElementById("f_placetype").value||"").trim() || "Other",
    address: editingRestaurant.address || "",
    placeId: editingRestaurant.placeId || "",
    city: document.getElementById("f_city").value.trim(),
    neighborhood: document.getElementById("f_nbhd").value.trim(),
    lat: hasLoc(editingRestaurant) ? editingRestaurant.lat : null,
    lng: hasLoc(editingRestaurant) ? editingRestaurant.lng : null,
    cuisines: categoryId==="food" ? editingRestaurant.cuisines.slice() : [],
    tags: editingRestaurant.tags.slice(),
    priceRange: categoryId==="food" ? (editingRestaurant.priceRange || null) : null,
    notes: document.getElementById("f_notes").value.trim(),
    favorite: !!editingRestaurant.favorite,
    tripId: editingRestaurant.tripId || null
  };
  finishSave(saveRestaurant(data, editingRestaurant.id));
}
function doSaveVisitFromForm(){
  var isNewSelect = document.getElementById("f_visit_restaurant");
  if(isNewSelect && !isNewSelect.value){ alert("Choose a place, or add a new one."); return; }
  var creatingNewPlace = !isNewSelect && editingRestaurant && !editingRestaurant.id;
  function collectVisitData(rid){
    var cat = categoryOf(editingRestaurant || state.restaurants[rid]);
    var priceVal = document.getElementById("f_price").value;
    var data = {
      restaurantId: rid,
      date: document.getElementById("f_date").value || todayStr(),
      ratingA: editingVisit.ratingA, ratingB: editingVisit.ratingB,
      wouldReturnA: editingVisit.wouldReturnA||null, wouldReturnB: editingVisit.wouldReturnB||null, wouldReturn: null,
      notesA: document.getElementById("f_notesA").value.trim(),
      notesB: document.getElementById("f_notesB").value.trim(),
      notes: "",
      price: priceVal!=="" ? parseFloat(priceVal) : null,
      photos: editingVisit.photoItems.filter(function(p){ return p.inline; }).map(function(p){ return p.data; }),
      dishes:[], favDishA:"", favDishB:""
    };
    (CATEGORY_VISIT_FIELDS[cat.id]||[]).forEach(function(f){
      var el = document.getElementById("f_extra_"+f.key);
      if(!el) return;
      data[f.key] = f.list ? el.value.trim().split(",").map(function(s){return s.trim();}).filter(Boolean) : el.value.trim();
    });
    if(cat.id==="food"){
      var fdA = document.getElementById("f_favdishA"), fdB = document.getElementById("f_favdishB");
      data.favDishA = fdA ? fdA.value.trim() : "";
      data.favDishB = fdB ? fdB.value.trim() : "";
    }
    return data;
  }
  function proceed(rid){
    var data = collectVisitData(rid);
    var sameDay = sameDayVisit(rid, data.date, editingVisit.id);
    var toSave = sameDay ? mergeEntryIntoVisit(sameDay, data) : data;
    // Nudge the other person only for a new entry that still has nothing from them.
    var partner = partnerOf(state.me||"A");
    var partnerDone = toSave["rating"+partner]!=null || !!toSave["notes"+partner] || !!toSave["wouldReturn"+partner] || !!toSave["favDish"+partner];
    var placeName = (state.restaurants[rid]||{}).name || (document.getElementById("f_name")||{}).value || "a new place";
    var nudge = !editingVisit.id && !partnerDone;
    var savePromise = !sameDay ? saveVisit(toSave, editingVisit.id)
      : saveVisit(toSave, sameDay.id).then(function(r){
          if(!editingVisit.id) return r;
          return movePhotos(editingVisit.id, sameDay.id).then(function(){ return deleteVisit(editingVisit.id, true); }).then(function(){ return r; });
        });
    savePromise = savePromise.then(function(visitId){ return syncVisitPhotos(visitId, rid).then(function(){ return visitId; }); });
    if(nudge) savePromise = savePromise.then(function(visitId){ nudgePartner(rid, placeName); return visitId; });
    if(editingRestaurant){
      savePromise = savePromise.then(function(r){ return updateRestaurant(rid, {favorite: !!editingRestaurant.favorite}).then(function(){ return r; }); });
    }
    finishSave(savePromise);
  }
  if(creatingNewPlace){
    var newName = document.getElementById("f_name").value.trim();
    if(!newName){ alert("Give this place a name."); return; }
    var dupVisit = findDuplicateRestaurant(newName);
    if(dupVisit){
      alert('"'+newName+'" is already saved — logging this visit against the existing entry.');
      proceed(dupVisit.id);
      return;
    }
    saveRestaurant({
      name:newName,
      category: editingRestaurant.category || "food",
      placeType: editingRestaurant.placeType || "Other",
      address: editingRestaurant.address || "",
      placeId: editingRestaurant.placeId || "",
      city:document.getElementById("f_city").value.trim(),
      neighborhood:document.getElementById("f_nbhd").value.trim(),
      lat: hasLoc(editingRestaurant) ? editingRestaurant.lat : null,
      lng: hasLoc(editingRestaurant) ? editingRestaurant.lng : null,
      cuisines:[], tags:[],
      favorite: !!editingRestaurant.favorite
    }).then(function(newId){ editingRestaurant.id = newId; proceed(newId); });
  } else if(isNewSelect){
    proceed(isNewSelect.value);
  } else {
    proceed(editingVisit.restaurantId);
  }
}

/* ---------- boot ---------- */
if(!state.me){ state.me = "A"; localStorage.setItem("pp_me","A"); }
applyTheme(state.theme);
renderAll();
initDb();
// Each device asks who's using it once and then remembers; the name in the top bar switches.
var meChosen = null;
try{ meChosen = localStorage.getItem("pp_me_chosen"); }catch(e){}
if(!meChosen) showWhoPicker();
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){ swReg = reg; return refreshMyPush(); })
    .catch(function(err){ console.warn("Service worker not registered", err); });
  // The app was already open when a notification was tapped.
  navigator.serviceWorker.addEventListener("message", function(e){
    var m = e.data && e.data.url && /[?&]review=([^&]+)/.exec(e.data.url);
    if(m){ pendingReview = decodeURIComponent(m[1]); openPendingReview(); }
  });
}
setTimeout(function(){ if(!state.dbReady && !state.loading){ seedLocalDemo(); renderAll(); } }, 900);
// Don't leave the loading screen up forever if the connection never answers.
setTimeout(function(){ if(state.loading){ state.loading = false; renderAll(); } }, 8000);
})();
